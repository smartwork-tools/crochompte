<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f5132">
<title>Crochompte</title>
<meta name="description" content="Calcule le vrai coût de revient de tes créations au crochet, ce que tu gagnes à l'heure, tes achats de matières et le suivi de tes pièces.">
<meta property="og:title" content="Crochompte">
<meta property="og:description" content="Combien tu gagnes vraiment, à l'heure, sur chaque création au crochet.">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Public+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root{
    --ground:#f4f3f0; --surface:#ffffff; --surface-2:#faf9f7;
    --ink:#1a1c1a; --muted:#6a6f6c; --rule:#e3e2dd; --rule-strong:#cdccc5;
    --primary:#0f5f57; --primary-ink:#0f5f57; --primary-soft:#e4efed; --on-primary:#ffffff;
    --good:#2f7d54; --good-soft:#e7f1ea;
    --warn:#9a6a0d; --warn-soft:#f6eeda;
    --bad:#b03a2b;  --bad-soft:#f8e9e6;
    --field:#ffffff;
    --hero:#0e3b37; --hero-ink:#eef6f4; --hero-muted:#9fc4bd;
    --s-1:#2a78d6; --s-2:#eb6834; --s-3:#1baf7a; --s-neutre:#9aa09c;
    --f-ami:#a8590f;     --f-ami-b:#fdf0dd;
    --f-bebe:#b1487a;    --f-bebe-b:#fdeaf2;
    --f-mode:#2b5da6;    --f-mode-b:#e7effb;
    --f-maison:#7d5327;  --f-maison-b:#f7eee2;
    --f-vegetal:#2f7145; --f-vegetal-b:#e7f3ea;
    --f-fete:#6b45a3;    --f-fete-b:#f0eafa;
    --f-perso:#a5323f;   --f-perso-b:#fce9eb;
  }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
    --ground:#121513; --surface:#1b1f1d; --surface-2:#171b19;
    --ink:#e9ebe8; --muted:#969e99; --rule:#2b302d; --rule-strong:#3c423e;
    --primary:#5fbfae; --primary-ink:#7fd0c0; --primary-soft:#15302c; --on-primary:#0b1513;
    --good:#6fb98d; --good-soft:#16281e;
    --warn:#d7a648; --warn-soft:#2a2316;
    --bad:#e28d79;  --bad-soft:#2d1d1a;
    --field:#121614;
    --hero:#0d2e2b; --hero-ink:#e9f3f1; --hero-muted:#8fb3ad;
    --s-1:#3987e5; --s-2:#d95926; --s-3:#199e70; --s-neutre:#6c7570;
    --f-ami:#e0a259;     --f-ami-b:#2c2115;
    --f-bebe:#e493b4;    --f-bebe-b:#2d1d24;
    --f-mode:#7ea6e8;    --f-mode-b:#18202f;
    --f-maison:#c69265;  --f-maison-b:#271e15;
    --f-vegetal:#74ba88; --f-vegetal-b:#17271b;
    --f-fete:#ae90dc;    --f-fete-b:#231b30;
    --f-perso:#dd858f;   --f-perso-b:#2c1b1e;
  }}
  :root[data-theme="dark"]{
    --ground:#121513; --surface:#1b1f1d; --surface-2:#171b19;
    --ink:#e9ebe8; --muted:#969e99; --rule:#2b302d; --rule-strong:#3c423e;
    --primary:#5fbfae; --primary-ink:#7fd0c0; --primary-soft:#15302c; --on-primary:#0b1513;
    --good:#6fb98d; --good-soft:#16281e;
    --warn:#d7a648; --warn-soft:#2a2316;
    --bad:#e28d79;  --bad-soft:#2d1d1a;
    --field:#121614;
    --hero:#0d2e2b; --hero-ink:#e9f3f1; --hero-muted:#8fb3ad;
    --s-1:#3987e5; --s-2:#d95926; --s-3:#199e70; --s-neutre:#6c7570;
    --f-ami:#e0a259;     --f-ami-b:#2c2115;
    --f-bebe:#e493b4;    --f-bebe-b:#2d1d24;
    --f-mode:#7ea6e8;    --f-mode-b:#18202f;
    --f-maison:#c69265;  --f-maison-b:#271e15;
    --f-vegetal:#74ba88; --f-vegetal-b:#17271b;
    --f-fete:#ae90dc;    --f-fete-b:#231b30;
    --f-perso:#dd858f;   --f-perso-b:#2c1b1e;
  }

  *{box-sizing:border-box;}
  body{background:var(--ground);color:var(--ink);font-family:"Public Sans",system-ui,-apple-system,Segoe UI,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;}
  h1,h2,h3,h4{font-family:"Bricolage Grotesque","Public Sans",system-ui,sans-serif;font-weight:600;margin:0;text-wrap:balance;}
  .num{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums;}
  a{color:var(--primary-ink);}

  /* chrome */
  .topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--surface);border-bottom:1px solid var(--rule);}
  .topbar-in{max-width:1100px;margin:0 auto;padding:12px 20px 0;display:flex;flex-direction:column;gap:10px;}
  .brandrow{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;}
  .brand{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:19px;letter-spacing:-.02em;cursor:pointer;background:none;border:none;color:inherit;padding:0;}
  .brand span{color:var(--primary-ink);}
  .brandnote{font-size:12.5px;color:var(--muted);}
  nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;}
  nav::-webkit-scrollbar{display:none;}
  nav button{appearance:none;background:none;border:none;font:inherit;font-weight:500;font-size:14px;color:var(--muted);cursor:pointer;padding:9px 13px 11px;border-bottom:2px solid transparent;white-space:nowrap;}
  nav button[aria-current="true"]{color:var(--ink);border-bottom-color:var(--primary);}
  nav button:hover{color:var(--ink);}
  main{max-width:1100px;margin:0 auto;padding:22px 20px 80px;}
  main.wide{max-width:1100px;}

  /* buttons + fields */
  button.btn{appearance:none;font:inherit;font-weight:500;font-size:14px;cursor:pointer;border-radius:7px;padding:8px 14px;border:1px solid var(--rule-strong);background:var(--surface);color:var(--ink);}
  button.btn:hover{border-color:var(--muted);}
  button.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--on-primary);}
  button.btn.primary:hover{filter:brightness(1.08);}
  button.btn.ghost{background:none;border-color:transparent;color:var(--muted);padding:6px 8px;}
  button.btn.ghost:hover{color:var(--bad);}
  button.btn.sm{padding:5px 10px;font-size:13px;}
  button.btn.lg{padding:12px 22px;font-size:15.5px;border-radius:8px;}
  button:focus-visible,a:focus-visible{outline:2px solid var(--primary);outline-offset:2px;}
  input,select{font:inherit;font-size:14px;color:var(--ink);background:var(--field);border:1px solid var(--rule-strong);border-radius:7px;padding:8px 10px;width:100%;}
  input:focus,select:focus{outline:2px solid var(--primary);outline-offset:-1px;border-color:var(--primary);}
  input[type=number]{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;}
  label.f{display:block;}
  label.f > span{display:block;font-size:12.5px;color:var(--muted);margin-bottom:5px;font-weight:500;}
  .hint{font-size:12.5px;color:var(--muted);margin:6px 0 0;}
  input[type=range]{-webkit-appearance:none;appearance:none;background:none;padding:0;border:none;height:26px;}
  input[type=range]::-webkit-slider-runnable-track{height:5px;border-radius:3px;background:var(--rule-strong);}
  input[type=range]::-moz-range-track{height:5px;border-radius:3px;background:var(--rule-strong);}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:var(--primary);border:3px solid var(--surface);margin-top:-8px;box-shadow:0 0 0 1px var(--rule-strong);cursor:grab;}
  input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--primary);border:3px solid var(--surface);box-shadow:0 0 0 1px var(--rule-strong);cursor:grab;}

  /* cards */
  .card{background:var(--surface);border:1px solid var(--rule);border-radius:10px;}
  .card > header{padding:16px 18px 0;}
  .card > header h2{font-size:16px;}
  .card > header p{margin:4px 0 0;font-size:13px;color:var(--muted);}
  .card > .body{padding:16px 18px 18px;}
  .grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;}
  .grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;}
  .banner{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--primary-soft);border:1px solid color-mix(in srgb,var(--primary) 22%,transparent);border-radius:8px;padding:11px 14px;margin-bottom:20px;font-size:13.5px;}
  .banner p{margin:0;flex:1 1 260px;}
  .chip{font-size:11px;font-weight:600;letter-spacing:.03em;padding:3px 8px;border-radius:20px;white-space:nowrap;display:inline-block;}
  .chip.good{background:var(--good-soft);color:var(--good);}
  .chip.warn{background:var(--warn-soft);color:var(--warn);}
  .chip.bad{background:var(--bad-soft);color:var(--bad);}
  .chip.neutral{background:var(--surface-2);color:var(--muted);border:1px solid var(--rule);}
  .hypo{display:inline-block;font-size:10px;font-weight:600;letter-spacing:.06em;background:var(--warn-soft);color:var(--warn);padding:2px 6px;border-radius:3px;vertical-align:1px;}
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:20px;}
  .tile{background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:14px 16px;}
  .tile .k{font-size:12px;color:var(--muted);font-weight:500;}
  .tile .v{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;font-size:24px;line-height:1.2;margin-top:6px;letter-spacing:-.02em;}
  .tile .v.good{color:var(--good);} .tile .v.bad{color:var(--bad);} .tile .v.warn{color:var(--warn);}
  .tile .s{font-size:12px;color:var(--muted);margin-top:4px;}
  .sechead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:26px 0 12px;}
  .pagehead{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin:0 0 20px;}
  .pagehead h1{font-size:23px;letter-spacing:-.02em;line-height:1.2;}
  .pagehead p{margin:5px 0 0;color:var(--muted);font-size:14px;max-width:62ch;}
  .pagehead .ph-act{display:flex;gap:8px;flex-wrap:wrap;}
  .vide{background:var(--surface);border:1px dashed var(--rule-strong);border-radius:12px;
    padding:34px 24px;text-align:center;}
  .vide h2{font-size:17px;}
  .vide p{margin:8px auto 0;color:var(--muted);max-width:52ch;font-size:14.5px;}
  .vide .v-act{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px;}
  .sechead h2{font-size:17px;}
  .tablewrap{overflow-x:auto;border:1px solid var(--rule);border-radius:10px;background:var(--surface);}
  table{border-collapse:collapse;width:100%;min-width:640px;font-size:13.5px;}
  th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--rule);vertical-align:middle;}
  thead th{font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:600;white-space:nowrap;background:var(--surface-2);}
  tbody tr:last-child td{border-bottom:none;}
  td.n,th.n{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap;}
  td input,td select{padding:5px 7px;font-size:13px;}
  .catrow td{background:var(--surface-2);font-weight:600;font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);}
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 22px);background:var(--ink);color:var(--ground);padding:10px 18px;border-radius:24px;font-size:13.5px;font-weight:500;z-index:80;box-shadow:0 4px 18px rgba(0,0,0,.18);}
  textarea{width:100%;font-family:"IBM Plex Mono",monospace;font-size:12px;border:1px solid var(--rule-strong);border-radius:7px;padding:10px;background:var(--field);color:var(--ink);min-height:110px;resize:vertical;}
  .savebar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:4px;}
  .seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--rule);border-radius:8px;padding:3px;gap:3px;}
  .seg button{appearance:none;border:none;background:none;font:inherit;font-size:13.5px;font-weight:500;color:var(--muted);padding:6px 14px;border-radius:6px;cursor:pointer;}
  .seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.06);}

  /* ── accueil ── */
  .home{margin:-22px -20px 0;}
  .hero{background:var(--hero);color:var(--hero-ink);padding:64px 32px 60px;border-radius:0 0 16px 16px;}
  .hero-in{max-width:1060px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:44px;align-items:center;}
  .hero .eyebrow{font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--hero-muted);}
  .hero h1{font-size:clamp(32px,5.2vw,50px);line-height:1.04;letter-spacing:-.03em;margin:14px 0 0;font-weight:700;color:#fff;}
  :root[data-theme="dark"] .hero h1{color:var(--hero-ink);}
  .hero p.lede{font-size:18px;line-height:1.55;color:var(--hero-muted);margin:18px 0 0;max-width:52ch;}
  .hero .cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px;}
  .hero .cta .btn{background:#fff;color:var(--hero);border-color:#fff;}
  .hero .cta .btn.alt{background:transparent;color:var(--hero-ink);border-color:var(--hero-muted);}
  .proof{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:22px;}
  .proof .t{font-size:12.5px;color:var(--hero-muted);}
  .proof .row{display:flex;justify-content:space-between;gap:12px;font-size:13.5px;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.1);}
  .proof .row span:last-child{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;}
  .proof .big{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;font-size:34px;letter-spacing:-.03em;margin-top:14px;color:#ffb4a2;}
  .proof .cap{font-size:12px;color:var(--hero-muted);margin-top:4px;}
  .homesec{max-width:1060px;margin:0 auto;padding:56px 20px 0;}
  .homesec h2{font-size:clamp(22px,3.4vw,30px);letter-spacing:-.02em;}
  .homesec p.sub{color:var(--muted);margin:10px 0 0;max-width:62ch;font-size:16px;}
  .feats{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px;margin-top:26px;}
  .feat{background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:20px;}
  .feat h3{font-size:15.5px;margin-bottom:7px;}
  .feat p{margin:0;font-size:14px;color:var(--muted);}
  .feat .n{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--primary-ink);font-weight:500;letter-spacing:.08em;}
  .whos{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px;margin-top:26px;}
  .who{background:var(--surface);border:1px solid var(--rule);border-top:3px solid var(--primary);border-radius:10px;padding:20px;}
  .who h3{font-size:16px;}
  .who .lvl{font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--primary-ink);}
  .who ul{margin:12px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:7px;font-size:14px;color:var(--muted);}
  .steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:18px;margin-top:26px;counter-reset:s;}
  .step{counter-increment:s;}
  .step::before{content:counter(s);font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--on-primary);background:var(--primary);width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin-bottom:10px;}
  .step h3{font-size:15px;margin-bottom:5px;}
  .step p{margin:0;font-size:13.5px;color:var(--muted);}
  .homecta{max-width:1060px;margin:56px auto 0;padding:0 20px;}
  .homecta .in{background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:32px;display:flex;justify-content:space-between;align-items:center;gap:22px;flex-wrap:wrap;}
  .homecta h2{font-size:22px;}
  .homecta p{margin:6px 0 0;color:var(--muted);font-size:15px;max-width:52ch;}
  .foot{max-width:1060px;margin:44px auto 0;padding:22px 20px 0;border-top:1px solid var(--rule);font-size:12.5px;color:var(--muted);}
  @media (max-width:820px){ .hero-in{grid-template-columns:1fr;gap:32px;} .hero{padding:40px 20px 36px;} }

  /* ── catalogue ── */
  .filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:18px;}
  .fchip{appearance:none;font:inherit;font-size:13px;font-weight:500;padding:6px 12px;border-radius:20px;border:1px solid var(--rule-strong);background:var(--surface);color:var(--muted);cursor:pointer;}
  .fchip[aria-pressed="true"]{background:var(--primary);border-color:var(--primary);color:var(--on-primary);}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;}
  .mcard{background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:16px;text-align:left;cursor:pointer;font:inherit;color:inherit;display:flex;flex-direction:column;gap:9px;}
  .mcard:hover{border-color:var(--muted);}
  .mcard .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;}
  .mcard h3{font-size:15px;line-height:1.25;}
  .mcard .meta{font-size:12px;color:var(--muted);}
  .mcard .figs{display:flex;gap:14px;margin-top:2px;padding-top:9px;border-top:1px solid var(--rule);}
  .mcard .fig{flex:1;}
  .mcard .fig b{display:block;font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;
    font-size:15px;font-weight:500;white-space:nowrap;}
  .mcard h3{flex:1;min-width:0;}
  .mcard .meta{white-space:normal;}
  .mcard .fig span{font-size:11px;color:var(--muted);}
  .diff{display:inline-flex;gap:2px;}
  .diff i{width:5px;height:5px;border-radius:50%;background:var(--rule-strong);display:block;}
  .diff i.on{background:var(--primary);}
  .mcard .top{align-items:center;}
  /* Pastille d'illustration : le fond prend la couleur de la famille. */
  .mot{border-radius:11px;padding:6px;display:flex;align-items:center;justify-content:center;}
  .mot.grand{border-radius:14px;padding:11px;}
  .f-ami .motif,.mot.f-ami{background:var(--f-ami-b);}
  .f-bebe .motif,.mot.f-bebe{background:var(--f-bebe-b);}
  .f-mode .motif,.mot.f-mode{background:var(--f-mode-b);}
  .f-maison .motif,.mot.f-maison{background:var(--f-maison-b);}
  .f-vegetal .motif,.mot.f-vegetal{background:var(--f-vegetal-b);}
  .f-fete .motif,.mot.f-fete{background:var(--f-fete-b);}
  .f-perso .motif,.mot.f-perso{background:var(--f-perso-b);}
  .mot .motif{background:none!important;}

  /* Vignette : photo de l'artisane si elle existe, sinon l'illustration. */
  .vignette{position:relative;display:inline-flex;align-items:center;justify-content:center;
    border-radius:10px;overflow:hidden;flex:none;}
  .vignette img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
  .vignette.a-photo .motif{display:none;}
  .photorow{display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap;}
  .photoslot{position:relative;width:104px;height:104px;border-radius:14px;overflow:hidden;
    display:flex;align-items:center;justify-content:center;flex:none;border:1px solid var(--rule);}
  .photoslot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
  .photoslot.a-photo .motif{display:none;}
  .photoact{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-start;flex:1 1 220px;}

  /* Codes couleur d'état de stock : une pastille, un mot, une jauge. */
  .etat{display:inline-flex;align-items:center;gap:7px;white-space:nowrap;}
  .pastille{width:9px;height:9px;border-radius:50%;flex:none;}
  .e-ok .pastille{background:var(--good);}   .e-ok{color:var(--good);}
  .e-bas .pastille{background:var(--warn);}  .e-bas{color:var(--warn);}
  .e-rupture .pastille{background:var(--bad);} .e-rupture{color:var(--bad);}
  .e-libre .pastille{background:var(--rule-strong);} .e-libre{color:var(--muted);}

            filtre:"tous", recherche:"", tri:"famille", fProd:"tous", fCom:"tous", periode:"mois",

function uid(){ return Math.random().toString(36).slice(2,9); }
function clone(o){ return JSON.parse(JSON.stringify(o)); }

function modele(id){
  for (var i=0;i<MODELES.length;i++) if (MODELES[i][0]===id) return MODELES[i];
  return MODELES[0];
}
function mNom(m){ return m[2]; }
function mLignes(m){ return m[5].map(function(l){ return {mid:l[0], qte:l[1]}; }); }
function mTemps(m){ return {prep:m[6][0], crochet:m[6][1], assemb:m[6][2], finition:m[6][3], emball:m[6][4]}; }

function matieresDefaut(){
  return MATIERES_DEFAUT.map(function(m){
    return {id:m[0], nom:m[1], cat:m[2], prix:m[3], contenance:m[4], unite:m[5],
            stock:0, seuil:0, pmp:m[3]/m[4], mouv:[],
            refCat:null, fibre:"", composition:"", grosseur:m[6]||"", metrage:null,
            crochetMin:null, crochetMax:null, bain:"",
            prixIndicatif:true, perso:false, maj:null};
  });
}

function creationDepuisModele(modeleId, nom, prix, canal){
  var m = modele(modeleId);
  return {id:uid(), nom:nom || (m[0]==="vide" ? "" : mNom(m)), modele:m[0],
          lignes:mLignes(m), temps:mTemps(m), canal:canal||"direct",
          prix:prix||0, expedition:0, exemple:false, seuilFini:0, migre:true, photo:null};
}

/* Reprend une sauvegarde d'une version antérieure sans rien perdre. */
function migrer(s){
  if (!s.reglages) s.reglages = {};
  var rd = {tauxHoraire:15, tauxPerte:8, cotisations:12.3, fraisFixes:0, piecesParMois:10,
            baseCout:"dernier", profil:"vend", mode:"simple"};
  for (var k in rd) if (s.reglages[k] === undefined) s.reglages[k] = rd[k];
  if (!Array.isArray(s.canaux) || !s.canaux.length) s.canaux = clone(CANAUX_DEFAUT);
  else {
    // complète les canaux anciens et ajoute les nouveaux
    var vus = {};
    s.canaux.forEach(function(c){
      vus[c.id] = true;
      ["annonce","comm","paiePct","paieFixe","offPct","offPart","tva"].forEach(function(f){
        if (typeof c[f] !== "number") c[f] = 0;
      });
    });
    CANAUX_DEFAUT.forEach(function(c){ if (!vus[c.id]) s.canaux.push(clone(c)); });
  }
  if (!Array.isArray(s.matieres)) s.matieres = matieresDefaut();
  var connues = {};
  s.matieres.forEach(function(m){
    connues[m.id] = true;
    if (typeof m.stock !== "number") m.stock = 0;
    if (typeof m.seuil !== "number") m.seuil = 0;
    if (typeof m.pmp !== "number" || !isFinite(m.pmp) || m.pmp <= 0) m.pmp = m.contenance ? m.prix/m.contenance : 0;
    if (!Array.isArray(m.mouv)) m.mouv = [];
    if (m.prixIndicatif === undefined) m.prixIndicatif = !m.perso;
    if (m.perso === undefined) m.perso = false;
    if (m.refCat === undefined) m.refCat = null;
  });
  matieresDefaut().forEach(function(m){ if (!connues[m.id]) s.matieres.push(m); });
  if (!Array.isArray(s.creations)) s.creations = [];
  if (!Array.isArray(s.pieces)) s.pieces = [];
  s.creations.forEach(function(c){
    if (typeof c.expedition !== "number") c.expedition = 0;
    if (typeof c.seuilFini !== "number") c.seuilFini = 0;
    if (c.photo === undefined) c.photo = null;
    // v3 comptait des quantités ; v4 suit des pièces individuelles.
    if (typeof c.stockFini === "number" && c.stockFini > 0 && !c.migre){
      for (var i=0;i<c.stockFini;i++){
        s.pieces.push({id:uid(), cid:c.id, prod:"termine", com:"atelier", cree:Date.now(), maj:Date.now(),
                       termineLe:Date.now(), venduLe:null, prix:null, canal:c.canal, client:"", note:"",
                       sortie:true, coutFige:0});
      }
    }
    if (Array.isArray(c.mouvFini) && !c.migre){
      c.mouvFini.forEach(function(mv){
        if (mv.t === "vente"){
          for (var j=0;j<mv.q;j++){
            s.pieces.push({id:uid(), cid:c.id, prod:"termine", com:"vendu", cree:mv.d, maj:mv.d,
                           termineLe:mv.d, venduLe:mv.d, prix:mv.pu||0, canal:c.canal, client:"", note:"",
                           sortie:true, coutFige:0});
          }
        }
      });
    }
    c.migre = true; c.stockFini = 0; c.mouvFini = [];
  });
  if (typeof s.vuAccueil !== "boolean") s.vuAccueil = false;
  if (!s.photosModeles || typeof s.photosModeles !== "object") s.photosModeles = {};
  if (!s.chrono || typeof s.chrono !== "object") s.chrono = {pid:null, poste:"crochet", debut:null};
  s.pieces.forEach(function(p){
    if (!p.mesure) p.mesure = {prep:0, crochet:0, assemb:0, finition:0, emball:0};
    if (!Array.isArray(p.sessions)) p.sessions = [];
  });
  return s;
}

function charger(){
  try{
    var raw = localStorage.getItem(KEY);
    if (!raw){
      // Reprise depuis l'ancien nom de l'application (« Atelier Juste Prix »),
      // pour qu'un renommage ne fasse perdre les données de personne.
      raw = localStorage.getItem("atelier-juste-prix-v1");
    }
    if (raw){
      var p = JSON.parse(raw);
      if (p && p.matieres && p.creations) return migrer(p);
    }
  }catch(e){}
  return etatInitial();
}
var tSauve = null;
function sauver(){
  if (tSauve) clearTimeout(tSauve);
  tSauve = setTimeout(function(){
    try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){}
  }, 250);
}
function sauverTout(){
  try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){}
  if (window.CrochompteSync && window.CrochompteSync.signaler) window.CrochompteSync.signaler();
}

/* ═════ PONT DE SYNCHRONISATION ═════
   L'application fonctionne seule, sans compte et sans réseau : tout vit dans
   ce navigateur. Un module externe (sync.js) peut se brancher ici pour ajouter
   des comptes et la synchronisation entre appareils. S'il est absent, rien ne
   change — c'est ce qui permet de servir la même application en ligne publique
   et en version hébergée avec comptes. */
function normaliser(){ if (typeof migrer === "function") migrer(state); }
window.CrochomptePont = {
  cle: KEY,
  version: 1,
  lire: function(){ return state; },
  ecrire: function(nouvel){
    if (!nouvel || typeof nouvel !== "object") return false;
    state = nouvel;
    normaliser();
    try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){}
    render();
    return true;
  },
  photo: {
    lire: function(id){ return lirePhoto(id); },
    ecrire: function(id, blob){ return ecrirePhoto(id, blob); },
    lister: function(){
      var ids = [];
      (state.creations||[]).forEach(function(c){ if (c.photo) ids.push(c.photo); });
      (state.pieces||[]).forEach(function(x){ if (x.photo) ids.push(x.photo); });
      for (var k in (state.photosModeles||{}))
        if (state.photosModeles[k] && state.photosModeles[k].photo) ids.push(state.photosModeles[k].photo);
      (state.patrons||[]).forEach(function(p){
        (p.pages||[]).forEach(function(pg){ if (pg.photo) ids.push(pg.photo); }); });
      return ids;
    }
  },
  surZoneCompte: function(fn){ pontCompte = fn; },
  redessiner: function(){ render(); },
  toast: function(m){ toast(m); },
  /* sync.js appelle ceci chaque fois que l'état de connexion est connu ou
     change : {exige:true} veut dire « ce déploiement demande un compte pour
     utiliser l'outil », {connecte:true/false} l'état actuel. Tant que rien
     n'a jamais été annoncé, l'application attend (renderChargement) au lieu
     de montrer quoi que ce soit. */
  definirEtatConnexion: function(info){ definirEtatConnexion(info); },
  /* sync.js dépose ici de quoi lire et publier la bibliothèque partagée.
     Tant qu'il ne l'a pas fait — installation sans compte, module non chargé —
     la bibliothèque n'existe simplement pas dans l'interface, plutôt que
     d'afficher des boutons qui ne feraient rien. */
  definirBibliotheque: function(api){ bibliothequePartagee = api; render(); }
};
var pontCompte = null;
var bibliothequePartagee = null;

/* ═════ 3. MOTEUR DE CALCUL ═════ */

function matiere(mid){
  for (var i=0;i<state.matieres.length;i++) if (state.matieres[i].id===mid) return state.matieres[i];
  return null;
}
/* Coût d'une unité : dernier prix payé, ou coût moyen pondéré selon le réglage. */
function pu(m){
  if (!m) return 0;
  if (state.reglages.baseCout === "pmp" && isFinite(m.pmp) && m.pmp > 0) return m.pmp;
  return m.contenance ? m.prix / m.contenance : 0;
}
function canal(id){
  for (var i=0;i<state.canaux.length;i++) if (state.canaux[i].id===id) return state.canaux[i];
  return state.canaux[0];
}
/* Taux et fixes réellement prélevés, TVA de la plateforme comprise. */
function fraisCanal(cn){
  var tva = 1 + (Number(cn.tva)||0)/100;
  return {
    pct:  ((Number(cn.comm)||0) + (Number(cn.paiePct)||0) + (Number(cn.offPct)||0)*(Number(cn.offPart)||0)) * tva,
    fixe: ((Number(cn.annonce)||0) + (Number(cn.paieFixe)||0)) * tva
  };
}

function calculer(cr){
  var r = state.reglages;
  var consommable = 0, emballage = 0, detail = [];
  for (var i=0;i<cr.lignes.length;i++){
    var l = cr.lignes[i], m = matiere(l.mid);
    if (!m) continue;
    var c = pu(m) * (Number(l.qte)||0);
    detail.push({mid:m.id, nom:m.nom, cout:c});
    if (m.cat === "fin") emballage += c; else consommable += c;
  }
  var perte = consommable * (Number(r.tauxPerte)||0)/100;
  var matieres = consommable + perte + emballage;

  var minutes = 0;
  for (var k in cr.temps) if (Object.prototype.hasOwnProperty.call(cr.temps,k)) minutes += Number(cr.temps[k])||0;
  var heures = minutes/60;
  var mainOeuvre = heures * (Number(r.tauxHoraire)||0);

  var piecesMois = Number(r.piecesParMois)||0;
  var fixePiece = piecesMois > 0 ? (Number(r.fraisFixes)||0)/piecesMois : 0;

  var cn = canal(cr.canal), f = fraisCanal(cn);
  var prix = Number(cr.prix)||0, expe = Number(cr.expedition)||0;
  var tauxCotis = (Number(r.cotisations)||0)/100;

  var cotisations = prix * tauxCotis;
  var fraisVar = prix * f.pct;
  var fraisFixesVente = f.fixe + expe;

  var reste = prix - (matieres + fixePiece + fraisFixesVente + fraisVar + cotisations);
  var gainHoraire = heures > 0 ? reste/heures : 0;

  var denom = 1 - tauxCotis - f.pct;
  var prixObjectif = denom > 0 ? (matieres + fixePiece + fraisFixesVente + mainOeuvre)/denom : 0;
  var prixPlancher = denom > 0 ? (matieres + fixePiece + fraisFixesVente)/denom : 0;
  var coutRevient = matieres + fixePiece + fraisFixesVente + fraisVar + cotisations + mainOeuvre;

  return {detail:detail, consommable:consommable, perte:perte, emballage:emballage, matieres:matieres,
          minutes:minutes, heures:heures, mainOeuvre:mainOeuvre, fixePiece:fixePiece,
          fraisVar:fraisVar, fraisFixesVente:fraisFixesVente, cotisations:cotisations,
          reste:reste, gainHoraire:gainHoraire, prixObjectif:prixObjectif,
          prixPlancher:prixPlancher, coutRevient:coutRevient, prix:prix};
}

/* Ce qu'il faut ACHETER pour fabriquer n exemplaires : conditionnements entiers,
   argent réellement sorti, et ce qui restera en stock après. */
function besoinAchat(cr, n, tenirCompteStock){
  n = Math.max(1, Number(n)||1);
  var lignes = [], investi = 0, consomme = 0, resteValeur = 0;
  var agrege = {};
  cr.lignes.forEach(function(l){
    if (!agrege[l.mid]) agrege[l.mid] = 0;
    agrege[l.mid] += (Number(l.qte)||0) * n;
  });
  Object.keys(agrege).forEach(function(mid){
    var m = matiere(mid); if (!m) return;
    var besoin = agrege[mid];
    var dispo = tenirCompteStock ? Math.max(0, Number(m.stock)||0) : 0;
    var manque = Math.max(0, besoin - dispo);
    var cond = m.contenance > 0 ? Math.ceil(manque / m.contenance) : 0;
    var qteAchetee = cond * m.contenance;
    var coutAchat = cond * m.prix;
    var coutConso = besoin * pu(m);
    var apres = dispo + qteAchetee - besoin;
    investi += coutAchat; consomme += coutConso; resteValeur += Math.max(0, apres) * pu(m);
    lignes.push({mid:mid, nom:m.nom, unite:m.unite, besoin:besoin, dispo:dispo, manque:manque,
                 cond:cond, qteAchetee:qteAchetee, coutAchat:coutAchat, coutConso:coutConso, apres:apres,
                 conditionnement:m.contenance, prixCond:m.prix});
  });
  lignes.sort(function(a,b){ return b.coutAchat - a.coutAchat; });
  return {n:n, lignes:lignes, investi:investi, consomme:consomme, resteValeur:resteValeur};
}

/* ═════ 4. STOCK ═════ */

function mouvementMatiere(m, type, qte, prixTotal, note){
  qte = Number(qte)||0;
  if (type === "entree"){
    var valeurAvant = Math.max(0, Number(m.stock)||0) * (Number(m.pmp)||0);
    var stockApres = Math.max(0, Number(m.stock)||0) + qte;
    var cout = (typeof prixTotal === "number" && prixTotal >= 0) ? prixTotal : qte * (m.contenance ? m.prix/m.contenance : 0);
    m.pmp = stockApres > 0 ? (valeurAvant + cout)/stockApres : (m.contenance ? m.prix/m.contenance : 0);
    m.stock = stockApres;
    if (qte > 0 && cout > 0 && m.contenance > 0){
      // le dernier prix payé devient la nouvelle référence catalogue
      m.prix = Math.round((cout / qte) * m.contenance * 100)/100;
    }
  } else if (type === "sortie"){
    m.stock = (Number(m.stock)||0) - qte;
  } else if (type === "inventaire"){
    m.stock = Math.max(0, qte);
  }
  /* Un mouvement de stock garde la trace de ce qui s'est réellement passé :
     la quantité, le prix unitaire pratiqué CE jour-là, le total payé, et le
     stock qui en résulte. Sans le prix unitaire et le stock après, on ne peut
     ni justifier une valeur d'inventaire ni comprendre un écart — c'est la
     différence entre un historique et un vrai journal de stock. */
  var puMouv = null;
  if (type === "entree"){
    puMouv = (typeof prixTotal === "number" && prixTotal > 0 && qte > 0)
      ? prixTotal / qte
      : (m.contenance ? m.prix / m.contenance : null);
  } else if (type === "sortie"){
    puMouv = Number(m.pmp) || (m.contenance ? m.prix/m.contenance : null);
  }
  m.mouv.unshift({
    d: Date.now(), t: type, q: qte,
    p: (typeof prixTotal === "number" ? prixTotal : (puMouv && type === "sortie" ? puMouv * qte : null)),
    pu: puMouv,
    sa: Number(m.stock) || 0,
    pmp: Number(m.pmp) || null,
    n: note || ""
  });
  if (m.mouv.length > 60) m.mouv.length = 60;
}

function valeurStockMatieres(){
  var v = 0;
  state.matieres.forEach(function(m){ v += Math.max(0, Number(m.stock)||0) * (Number(m.pmp)||pu(m)); });
  return v;
}
/* Un état de stock se lit en une couleur et un mot, jamais en faisant un calcul mental. */
function etatStock(m){
  var st = Number(m.stock)||0, se = Number(m.seuil)||0;
  var suivie = se > 0 || st !== 0 || (m.mouv && m.mouv.length > 0);
  if (!suivie)            return {k:"libre", lib:"Non suivie", c:"var(--rule-strong)", pct:0, muet:true};
  if (st <= 0)            return {k:"rupture", lib:"Rupture",     c:"var(--bad)",  pct:0};
  if (se > 0 && st < se)  return {k:"bas",     lib:"À racheter",  c:"var(--warn)", pct:Math.max(6, st/se*100)};
  if (se > 0)             return {k:"ok",      lib:"Suffisant",   c:"var(--good)", pct:Math.min(100, st/se*100)};
  return {k:"libre", lib:"En stock", c:"var(--rule-strong)", pct:100};
}
function etatFini(cr){
  var st = enStock(cr.id), se = Number(cr.seuilFini)||0;
  if (se > 0 && st === 0) return {k:"rupture", lib:"Épuisée",    c:"var(--bad)",  pct:0};
  if (se > 0 && st < se)  return {k:"bas",     lib:"À refaire",  c:"var(--warn)", pct:Math.max(6, st/se*100)};
  if (se > 0)             return {k:"ok",      lib:"Suffisant",  c:"var(--good)", pct:Math.min(100, st/se*100)};
  return {k:"libre", lib:(st? "En stock":"Aucune"), c:"var(--rule-strong)", pct:0, muet:true};
}
function badgeEtat(e, valeur){
  return '<span class="etat e-'+e.k+'"><span class="pastille"></span>'+esc(valeur||e.lib)+'</span>';
}
function jauge(e){
  if (e.muet) return "";   /* pas de jauge pour ce qu'on ne suit pas : moins de bruit */
  return '<div class="jauge"><i style="width:'+Math.min(100,Math.max(0,e.pct)).toFixed(0)+'%;background:'+e.c+'"></i></div>';
}

function alertesStock(){
  return state.matieres.filter(function(m){
    return (Number(m.seuil)||0) > 0 && (Number(m.stock)||0) < Number(m.seuil);
  });
}

/* ═════ 5. FORMATS ═════ */

function eur(n){
  if (!isFinite(n)) n = 0;
  return (n<0?"−":"") + Math.abs(n).toFixed(2).replace(".",",") + " €";
}
function qte(n, unite){
  if (!isFinite(n)) n = 0;
  var s = (Math.round(n*100)/100).toString().replace(".",",");
  return s + (unite ? " " + unite : "");
}
function dureeTexte(min){
  min = Math.round(Number(min)||0);
  var h = Math.floor(min/60), m = min%60;
  if (h===0) return m + " min";
  if (m===0) return h + " h";
  return h + " h " + (m<10?"0":"") + m;
}
function pct(x){ return (Math.round(x*1000)/10).toString().replace(".",",") + " %"; }
/* Un nombre écrit comme on l'écrit en français : virgule, et pas de zéro
   décoratif derrière (4 et non 4,00 ; 2,25 reste 2,25). */
function nb(x){
  var v = Number(x); if (!isFinite(v)) return "";
  return (Math.round(v*100)/100).toString().replace(".",",");
}
/* Prix unitaire d'une matière, arrondi au centième de centime : à 2 décimales
   seulement, un fil à 2,70 € les 50 g afficherait « 0,05 € / g » et le détail
   ne retomberait jamais sur le total. */
function eurU(n, unite){
  if (!isFinite(n)) n = 0;
  var d = Math.abs(n) >= 1 ? 2 : 4;
  return n.toFixed(d).replace(".",",") + " €" + (unite ? " / " + unite : "");
}
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function el(html){
  var t = document.createElement("template");
  t.innerHTML = html.trim();
  return t.content.firstElementChild;
}
function toast(msg){
  var t = document.querySelector(".toast");
  if (t) t.remove();
  t = el('<div class="toast">'+esc(msg)+'</div>');
  document.body.appendChild(t);
  setTimeout(function(){ if (t.parentNode) t.remove(); }, 2400);
}
function statut(gain){
  var obj = Number(state.reglages.tauxHoraire)||0;
  if (gain < 0) return {k:"bad", t:"À perte"};
  if (obj <= 0) return {k:"warn", t:"Objectif non défini"};
  if (gain < obj*0.5) return {k:"bad", t:"Très sous-payée"};
  if (gain < obj*0.9) return {k:"warn", t:"Sous-payée"};
  return {k:"good", t:"Tu t'y retrouves"};
}

var TABS = [
  {id:"accueil",     nom:"Accueil",        base:true},
  {id:"demarrage",   nom:"Mise en route",  base:true, tantQueAFaire:true},
  {id:"catalogue",   nom:"Catalogue",      base:true},
  {id:"creations",   nom:"Mes créations",  base:true},
  {id:"fiche",       nom:"Fiche en cours", brouillon:true},
  {id:"commandes",   nom:"Commandes",      base:true},
  {id:"atelier",     nom:"Atelier"},
  {id:"patrons",     nom:"Mes patrons",    base:true},
  {id:"stock",       nom:"Matières",       base:true},
  {id:"indicateurs", nom:"Indicateurs"},
  {id:"reglages",    nom:"Réglages",       base:true}
];
/* Les onglets visibles dépendent du mode choisi. Un brouillon non enregistré
   affiche toujours le sien : changer d'onglet perdait le travail saisi. */
function onglets(){
  var complet = state.reglages.mode === "complet";
  return TABS.filter(function(t){
    if (t.brouillon) return !!view.draft;
    /* La mise en route s'efface d'elle-même une fois tout renseigné :
       un onglet qui n'a plus rien à dire est du bruit. On y revient
       depuis les réglages. */
    if (t.tantQueAFaire && view.tab !== "demarrage" && demarrageTermine()) return false;
    return complet || t.base;
  });
}

function aller(tab, opts){
  opts = opts || {};
  if (opts.sub) view.sub = opts.sub;
  view.tab = tab;
  render();
}

function renderNav(){
  var nav = document.getElementById("nav");
  nav.innerHTML = "";
  onglets().forEach(function(t){
    var b = el('<button type="button">'+esc(t.nom)+'</button>');
    if (view.tab === t.id) b.setAttribute("aria-current","true");
    b.addEventListener("click", function(){
      aller(t.id);
    });
    nav.appendChild(b);
  });
}

function render(){
  arreterVoix();
  renderNav();
  var main = document.getElementById("main");
  main.innerHTML = "";
  if (view.tab === "accueil")        renderAccueil(main);
  else if (view.tab === "patrons")   renderPatrons(main);
  else if (view.tab === "commandes") renderCommandes(main);
  else if (view.tab === "demarrage") renderDemarrage(main);
  else if (view.tab === "catalogue") view.modeleVu ? renderModeleDetail(main) : renderCatalogue(main);
  else if (view.tab === "creations") renderCreations(main);
  else if (view.tab === "fiche")     renderFiche(main);
  else if (view.tab === "atelier")   renderAtelier(main);
  else if (view.tab === "indicateurs") renderIndicateurs(main);
  else if (view.tab === "stock")     renderStock(main);
  else                               renderReglages(main);
  hydraterPhotos(main);
  majBarreChrono();
  window.scrollTo(0,0);
}

/* ═════ 6 bis. ÉCRAN DE CONNEXION OBLIGATOIRE ═════
   Seulement quand config.js déclare une installation avec comptes. Sans lui,
   ce qui suit ne s'exécute jamais : render() reste l'unique point d'entrée,
   exactement comme avant.

   sync.js est seul à savoir si une session existe déjà (elle vit dans son
   propre stockage) : tant qu'il n'a rien annoncé via definirEtatConnexion(),
   on ne sait pas s'il faut montrer l'outil ou un formulaire de connexion —
   donc on attend, pour ne jamais laisser entrevoir l'atelier avant d'être
   sûr que la personne a le droit d'y être. */
var etatAcces = {recu:false, exige:false, connecte:false};
var minuteurChargement = null;

function definirEtatConnexion(info){
  info = info || {};
  if (minuteurChargement){ clearTimeout(minuteurChargement); minuteurChargement = null; }
  etatAcces.recu = true;
  etatAcces.exige = !!info.exige;
  etatAcces.connecte = !!info.connecte;
  renderRacine();
}

function renderRacine(){
  if (etatAcces.exige && !etatAcces.connecte) renderPortail();
  else render();
}

function renderChargement(){
  arreterVoix();
  document.getElementById("nav").innerHTML = "";

  main.innerHTML = "";
  main.appendChild(el(

    '<p>Connexion au service…</p></div>'
  ));
}

/* Écran plein cadre, hors des onglets habituels : c'est le passage obligé

}

/* ═════ 8. CATALOGUE ═════ */

function coutRapide(modeleId){
  var cr = creationDepuisModele(modeleId, "", 0, "direct");
  return calculer(cr);
}
var DIFF = ["Facile", "Intermédiaire", "Exigeant"];
function niveau(d){
  var h = '<span class="niv" title="Difficulté : '+esc(DIFF[d-1])+'">';
  for (var i=1;i<=3;i++) h += '<i class="'+(i<=d?"on":"")+'"></i>';
  return h + '</span>';
}
function fourchette(f){
  if (!f || !f[1]) return "—";   /* pas de relevé : on n'invente pas */
  return String(Math.round(f[0])) + "–" + String(Math.round(f[1])) + " €";
}
/* Un modèle n'entre au catalogue que s'il a une vraie photo de la pièce :
   celle du livret d'origine, ou celle prise par l'artisane. Sans photo, il n'y
   a rien à regarder et rien sur quoi se projeter — c'est un type d'ouvrage,
   pas un modèle. */
function aVraiePhoto(mid){ return !!epoque(mid) || aPhotoModele(mid); }

function renderCatalogue(main){
  var total = MODELES.length - 1;
  var avecPhoto = MODELES.filter(function(m){ return m[0]!=="vide" && aVraiePhoto(m[0]); }).length;
  if (view.catMode !== "types") view.catMode = "modeles";
  var modeM = view.catMode === "modeles";

  main.appendChild(enTete(
    modeM ? "Modèles" : "Types d'ouvrage",
    modeM
      ? "Des pièces réelles : la photo de l'ouvrage, son patron complet et son coût. "+
        "Rien n'est ici sans sa photo — tu dois pouvoir voir ce que tu vas faire."
      : "Les "+total+" entrées qui servent à démarrer une fiche de coût : matières et temps "+
        "habituels. Ce ne sont pas des modèles précis, et c'est pour ça qu'ils n'ont pas de photo."));

  var segs = el('<div class="segs" role="group" aria-label="Affichage du catalogue"></div>');
  [["modeles","Modèles avec photo ("+avecPhoto+")"],["types","Tous les types d'ouvrage ("+total+")"]]
  .forEach(function(o){
    var b = el('<button type="button">'+esc(o[1])+'</button>');
    b.setAttribute("aria-pressed", view.catMode === o[0] ? "true" : "false");
    b.addEventListener("click", function(){ view.catMode = o[0]; render(); });
    segs.appendChild(b);
  });
  main.appendChild(segs);

  var filtres = el('<div class="filters"></div>');
  var parFamille = {}, nFiltre = 0;
  MODELES.forEach(function(m){
    if (m[0] === "vide") return;
    if (modeM && !aVraiePhoto(m[0])) return;   /* compter ce qui est réellement affiché */
    parFamille[m[1]] = (parFamille[m[1]]||0)+1; nFiltre++;
  });

  var tous = el('<button type="button" class="fchip">Toutes <span class="n">'+nFiltre+'</span></button>');
  tous.setAttribute("aria-pressed", view.filtre === "tous" ? "true" : "false");
  tous.addEventListener("click", function(){ view.filtre = "tous"; render(); });
  filtres.appendChild(tous);
  FAMILLES.forEach(function(f){
    if (!parFamille[f.id]) return;   /* une famille sans modèle affiché n'est pas un filtre */
    var b = el('<button type="button" class="fchip"><span class="pastille" style="background:var(--f-'+esc(f.id)+')"></span> '+
      esc(f.nom)+' <span class="n">'+parFamille[f.id]+'</span></button>');
    b.style.display = "inline-flex"; b.style.alignItems = "center"; b.style.gap = "7px";
    b.setAttribute("aria-pressed", view.filtre === f.id ? "true" : "false");
    b.addEventListener("click", function(){ view.filtre = f.id; render(); });
    filtres.appendChild(b);
  });
  main.appendChild(filtres);

  var barre = el('<div class="grid2" style="max-width:640px;margin-bottom:16px">'+
    '<label class="f"><span>Rechercher un modèle</span><input type="text" id="cat-q" placeholder="lapin, bonnet, panier…"></label>'+
    '<label class="f"><span>Trier par</span><select id="cat-tri">'+
      '<option value="famille">Famille</option>'+
      '<option value="temps">Temps de travail, du plus court</option>'+
      '<option value="matieres">Coût des matières, du plus bas</option>'+
      '<option value="prix">Prix courant, du plus bas</option>'+
      '<option value="diff">Difficulté, de la plus facile</option>'+
    '</select></label>'+
    '<label class="f"><span>Affichage</span><select id="cat-pat">'+
      '<option value="tous">Tous les types</option>'+
      '<option value="avec">Seulement ceux avec un patron</option>'+
    '</select></label></div>');
  barre.querySelector("#cat-pat").value = view.catPat || "tous";
  barre.querySelector("#cat-pat").addEventListener("change", function(e){
    view.catPat = e.target.value; peindreCartes();
  });
  barre.querySelector("#cat-q").value = view.recherche;
  barre.querySelector("#cat-tri").value = view.tri || "famille";
  barre.querySelector("#cat-q").addEventListener("input", function(e){
    view.recherche = e.target.value; peindreCartes();
  });
  barre.querySelector("#cat-tri").addEventListener("change", function(e){
    view.tri = e.target.value; peindreCartes();
  });
  main.appendChild(barre);
  var compte = el('<p class="compte" id="cat-compte"></p>');
  main.appendChild(compte);

  var grid = el('<div class="cards" id="cat-grid"></div>');
  main.appendChild(grid);
  var vide = el('<p class="hint" id="cat-vide" hidden>Aucun r\u00e9sultat. Essaie un autre mot, '+
    'ou regarde tous les types d\'ouvrage.</p>');
  main.appendChild(vide);

  function peindreCartes(){
    grid.innerHTML = "";
    var q = view.recherche.trim().toLowerCase();
    var liste = MODELES.filter(function(m){
      if (m[0] === "vide") return false;
      if (view.filtre !== "tous" && m[1] !== view.filtre) return false;
      if (q && (mNom(m)+" "+m[3]).toLowerCase().indexOf(q) === -1) return false;
      if (view.catPat === "avec" && !patronDe(m[0])) return false;
      if (modeM && !aVraiePhoto(m[0])) return false;
      return true;
    });
    var tri = view.tri || "famille";
    if (tri !== "famille"){
      liste = liste.slice().sort(function(a,b){
        if (tri === "diff") return a[4] - b[4];
        if (tri === "prix") return a[7][0] - b[7][0];
        var ra = coutRapide(a[0]), rb = coutRapide(b[0]);
        if (tri === "temps") return ra.minutes - rb.minutes;
        return ra.matieres - rb.matieres;
      });
    }
    var n = liste.length;
    compte.textContent = n === 0 ? "" :
      (n + (n>1 ? (modeM ? " modèles affichés" : " types affichés")
                : (modeM ? " modèle affiché"  : " type affiché"))) +

          '<div class="figs">'+

  if (!modeM) main.appendChild(el(

    'Les temps et les grammages sont des moyennes — les tiens seront différents, et c\'est eux qui comptent.</p>'
  ));

function renderModeleDetail(main){
  var m = modele(view.modeleVu);
  var four = m[7];
  /* Un premier calcul à prix = 0 sert uniquement à obtenir prixObjectif
     (qui ne dépend pas du prix, par construction). On recalcule ensuite au
     prix suggéré : à prix = 0, les cotisations et les frais variables du
     canal — proportionnels au prix de vente — seraient comptés pour zéro,
     et la tuile « Coût de revient complet » sous-estimerait le vrai coût. */
  var crPrevisionnel = creationDepuisModele(m[0], mNom(m), 0, "direct");
  var prixObjectifPrevisionnel = calculer(crPrevisionnel).prixObjectif;
  var prixSuggere = Math.max(four[0], prixObjectifPrevisionnel ? Math.round(prixObjectifPrevisionnel) : four[0]);
  var cr = creationDepuisModele(m[0], mNom(m), prixSuggere, "direct");
  var r = calculer(cr);

  var back = el('<button type="button" class="btn sm" style="margin-bottom:16px">← Retour au catalogue</button>');
  back.addEventListener("click", function(){ view.modeleVu = null; render(); });
  main.appendChild(back);

  var fam = "";
  FAMILLES.forEach(function(f){ if (f.id === m[1]) fam = f.nom; });

  main.appendChild(el(
    '<div class="sechead" style="margin-top:0"><div style="display:flex;gap:16px;align-items:center">'+
    '<span class="mot grand f-'+esc(m[1])+'">'+motif(m[0],58)+'</span>'+
    '<div><h2 style="font-size:24px">'+esc(mNom(m))+'</h2>'+
    '<p class="hint" style="margin-top:6px">'+esc(fam)+' · '+esc(m[3])+' · '+niveau(m[4])+esc(DIFF[m[4]-1])+' · '+esc(dureeTexte(r.minutes))+' de travail</p>'+
    '</div></div></div>'
  ));

  var tiles = el('<div class="tiles"></div>');
  tiles.appendChild(el('<div class="tile"><div class="k">Matières et emballage</div><div class="v">'+esc(eur(r.matieres))+'</div><div class="s">pertes comprises</div></div>'));
  tiles.appendChild(el('<div class="tile"><div class="k">Temps de travail</div><div class="v">'+esc(dureeTexte(r.minutes))+'</div><div class="s">tous postes</div></div>'));
  tiles.appendChild(el('<div class="tile"><div class="k">Coût de revient complet</div><div class="v">'+esc(eur(r.coutRevient))+'</div><div class="s">à '+esc(eur(state.reglages.tauxHoraire))+' / h, vente directe</div></div>'));
  tiles.appendChild(el('<div class="tile"><div class="k">Prix pour t\'y retrouver</div><div class="v good">'+esc(eur(r.prixObjectif))+'</div><div class="s">'+(four[1] ? 'fourchette courante '+esc(eur(four[0]))+'–'+esc(eur(four[1]))
      : 'aucun repère de marché relevé pour ce modèle')+'</div></div>'));
  main.appendChild(tiles);

  if (four[1] && r.prixObjectif > four[1] * 1.15){
    main.appendChild(el(
      '<div class="banner" style="background:var(--warn-soft);border-color:var(--warn)"><p>'+
      '<b>Écart à regarder en face.</b> Le prix qui te paierait '+esc(eur(state.reglages.tauxHoraire))+' de l\'heure ('+esc(eur(r.prixObjectif))+') '+
      'dépasse ce qui se pratique couramment pour ce type de pièce. Ce n\'est pas une erreur de calcul : c\'est la réalité de beaucoup de créations au crochet. '+
      'Tes leviers sont le temps de fabrication, le choix des matières, et le canal de vente — pas seulement l\'étiquette de prix.</p></div>'
    ));
  }

  /* On voit d'abord à quoi ça ressemble et comment on le fait.
     Le détail des coûts vient ensuite : on réalise avant de calculer. */
  var ep = epoque(m[0]);
  if (ep && !aPhotoModele(m[0])){
    main.appendChild(el('<div class="card" style="margin-bottom:18px;overflow:hidden">'+
      '<img src="'+esc(ep.photo)+'" alt="Photo d\'origine du modèle '+esc(ep.nom)+'" '+
      'style="width:100%;max-height:420px;object-fit:contain;display:block;background:var(--surface-2)" loading="lazy">'+
      (ep.photo2 ? '<img src="'+esc(ep.photo2)+'" alt="Le point de près, '+esc(ep.nom)+'" '+
        'style="width:100%;max-height:300px;object-fit:cover;display:block;border-top:1px solid var(--rule)" '+
        'loading="lazy">' : '')+
      '<div class="body">'+(ep.photo2 ? '<p class="hint" style="margin:0 0 10px">Le point vu de près, '+
        'tel qu\'il est photographié dans le livret.</p>' : '')+
      '<p class="dessinlab" style="margin:0"><b>La photo du livret d\'origine.</b> '+
      'C\'est cette pièce-là que le patron ci-dessous fait faire — pas un ouvrage ressemblant.</p>'+
      '<p class="hint" style="margin-top:8px">'+esc(ep.source.livre)+' · '+esc(ep.source.editeur)+
      ' · '+esc(ep.source.annee)+' · '+esc(ep.source.plate)+'. Domaine public '+
      '(Project Gutenberg n° '+ep.source.pg+') : photo et patron sont librement reproductibles. '+
      'Texte traduit et converti en centimètres pour cette application.</p></div></div>'));
  } else if (!aPhotoModele(m[0])){
    /* Une photo d'illustration d'abord, si on en a une : elle donne l'idée.
       Le dessin la suit, parce que lui seul dit exactement ce que ce patron
       produit. Les deux ensemble, jamais l'un à la place de l'autre. */
    var cIll = carteIllustration(m[0]);
    if (cIll) main.appendChild(cIll);
    /* Le dessin est construit à partir du patron : il ne peut pas promettre
       autre chose que ce que la fiche fait réellement faire. */
    var cp = el('<div class="card" style="margin-bottom:18px;overflow:hidden">'+
      planche(m[0], 230)+
      '<div class="body"><p class="dessinlab" style="margin:0">'+
      '<b>Dessin d\'après le patron de cette fiche</b> — forme, proportions et dimensions '+
      'finies. Ce n\'est pas une photo, et il n\'y en a pas encore : mettre ici l\'ouvrage '+
      'de quelqu\'un d\'autre te promettrait un rendu que ce patron ne donne pas.</p>'+
      '<p class="hint">Quand tu auras fait la pièce, ta photo prendra la place du dessin.</p>'+
      '</div></div>');
    main.appendChild(cp);
  }
  var ft = ficheTechnique(m[0]);
  if (ft) main.appendChild(ft);
  main.appendChild(cartePatron(m[0]));

  /* matières du modèle */
  var wrap = el('<div class="tablewrap resp" style="margin-bottom:18px"></div>');
  var t = el('<table><thead><tr><th>Matière du modèle</th><th class="n">Quantité</th><th class="n">Coût unitaire</th><th class="n">Coût dans la pièce</th></tr></thead><tbody></tbody></table>');
  var tb = t.querySelector("tbody");
  cr.lignes.forEach(function(l){
    var mm = matiere(l.mid); if (!mm) return;
    tb.appendChild(el('<tr><td>'+esc(mm.nom)+'</td><td class="n" data-l="Quantité">'+esc(qte(l.qte, mm.unite))+'</td><td class="n" data-l="Coût unitaire">'+
      esc(eur(pu(mm)))+' / '+esc(mm.unite)+'</td><td class="n" data-l="Dans la pièce">'+esc(eur(pu(mm)*l.qte))+'</td></tr>'));
  });
  tb.appendChild(el('<tr><td colspan="3" style="font-weight:600">Total matières et emballage, pertes comprises</td><td class="n" data-l="Total" style="font-weight:600">'+esc(eur(r.matieres))+'</td></tr>'));
  wrap.appendChild(t);
  main.appendChild(wrap);

  /* temps */
  var wrap2 = el('<div class="tablewrap resp" style="margin-bottom:18px"></div>');
  var t2 = el('<table style="min-width:420px"><thead><tr><th>Poste de travail</th><th class="n">Durée</th><th class="n">Valorisée à '+esc(eur(state.reglages.tauxHoraire))+' / h</th></tr></thead><tbody></tbody></table>');
  var tb2 = t2.querySelector("tbody");
  POSTES.forEach(function(p){
    var min = cr.temps[p.k]||0;
    tb2.appendChild(el('<tr><td>'+esc(p.nom)+'<div class="hint" style="margin:2px 0 0">'+esc(p.aide)+'</div></td><td class="n" data-l="Durée">'+
      esc(dureeTexte(min))+'</td><td class="n" data-l="Valorisée">'+esc(eur(min/60*(state.reglages.tauxHoraire||0)))+'</td></tr>'));
  });
  tb2.appendChild(el('<tr><td style="font-weight:600">Total</td><td class="n" data-l="Durée totale" style="font-weight:600">'+esc(dureeTexte(r.minutes))+'</td><td class="n" data-l="Valorisée" style="font-weight:600">'+esc(eur(r.mainOeuvre))+'</td></tr>'));
  wrap2.appendChild(t2);
  main.appendChild(wrap2);

  main.appendChild(blocPhotoModele(m, function(){ hydraterPhotos(document); render(); }));

  var bar = el('<div class="savebar"></div>');
  var bFiche = el('<button type="button" class="btn primary lg">Créer ma fiche à partir de ce modèle</button>');
  bFiche.addEventListener("click", function(){
    view.draft = creationDepuisModele(m[0], mNom(m), prixSuggere, "direct");
    view.ficheId = null; view.modeleVu = null;
    aller("fiche");
  });
  bar.appendChild(bFiche);
  main.appendChild(bar);

/* ═════ 9. MES CRÉATIONS ═════ */

function renderCreations(main){
  main.appendChild(enTete("Mes créations",
    "Une fiche par modèle que tu fabriques : ses matières, ton temps, et ce qu'elle te paie de l'heure.",
    [bouton("Partir d'un type d'ouvrage", function(){ view.modeleVu=null; view.catMode="types"; aller("catalogue"); }),
     bouton("+ Nouvelle création", nouvelleFiche, true)]));

  if (state.creations.some(function(c){ return c.exemple; })){
    var ban = el('<div class="banner"><p><b>Trois créations d\'exemple</b> sont chargées pour que tu voies tout de suite comment ça marche. Elles ne sont pas les tiennes.</p></div>');
    var bb = el('<button type="button" class="btn sm">Effacer les exemples</button>');
    bb.addEventListener("click", function(){
      state.creations.filter(function(c){ return c.exemple; })
        .forEach(function(c){ supprimerCreation(c.id); });
      sauverTout(); render(); toast("Exemples effacés");
    });
    ban.appendChild(bb);
    main.appendChild(ban);
  }

  var calculs = state.creations.map(function(c){ return {c:c, r:calculer(c)}; });
  var aPerte = calculs.filter(function(x){ return x.r.reste < 0; }).length;
  var obj = Number(state.reglages.tauxHoraire)||0;
  var sousPayees = calculs.filter(function(x){ return x.r.reste >= 0 && x.r.gainHoraire < obj*0.9; }).length;
  var gains = calculs.filter(function(x){ return x.r.heures > 0; }).map(function(x){ return x.r.gainHoraire; });
  var median = 0;
  if (gains.length){
    gains.sort(function(a,b){ return a-b; });
    var mid = Math.floor(gains.length/2);
    median = gains.length%2 ? gains[mid] : (gains[mid-1]+gains[mid])/2;
  }
  var ms = statut(median);

  var tiles = el('<div class="tiles"></div>');
  tiles.appendChild(el('<div class="tile"><div class="k">Créations suivies</div><div class="v">'+calculs.length+'</div></div>'));
  tiles.appendChild(el('<div class="tile"><div class="k">Ton heure, en médiane</div><div class="v '+ms.k+'">'+esc(eur(median))+'</div><div class="s">objectif : '+esc(eur(obj))+' / h</div></div>'));
  tiles.appendChild(el('<div class="tile"><div class="k">Vendues à perte</div><div class="v '+(aPerte?"bad":"good")+'">'+aPerte+'</div><div class="s">le prix ne couvre pas les sorties</div></div>'));
  tiles.appendChild(el('<div class="tile"><div class="k">Sous-payées</div><div class="v '+(sousPayees?"warn":"good")+'">'+sousPayees+'</div><div class="s">en dessous de ton objectif</div></div>'));
  main.appendChild(tiles);

  var inv = inviteComplet("Suivre tes pièces une par une, gérer les commandes de tes clientes et voir tes indicateurs de production.");
  if (inv && calculs.length) main.appendChild(inv);

  main.appendChild(el('<div class="sechead" style="margin-top:0"><h2>Le détail, création par création</h2></div>'));

  if (!calculs.length){
    main.appendChild(etatVide("Aucune création pour l'instant",
      "Commence par celle que tu vends ou fabriques le plus souvent : c'est celle où une erreur de prix te coûte le plus cher. Le catalogue remplit les matières et les temps à ta place.",
      [bouton("Partir d'un type d'ouvrage", function(){ view.modeleVu=null; view.catMode="types"; aller("catalogue"); }, true),
       bouton("Partir d'une fiche vide", nouvelleFiche)]));
    return;
  }

  calculs.sort(function(a,b){ return a.r.gainHoraire - b.r.gainHoraire; });

  var wrap = el('<div class="tablewrap resp"></div>');
  var t = el('<table><thead><tr><th>Création</th><th class="n">Prix de vente</th><th class="n">Ce que ça te coûte</th><th class="n">Il te reste</th><th class="n">Par heure</th><th style="width:120px">Travail</th><th>État</th><th class="n">En stock</th></tr></thead><tbody></tbody></table>');
  var tb = t.querySelector("tbody");
  calculs.forEach(function(x){
    var st = statut(x.r.gainHoraire);
    var coul = st.k === "good" ? "var(--good)" : st.k === "warn" ? "var(--warn)" : "var(--bad)";
    var sorties = x.r.prix - x.r.reste;
    var tr = el(
      '<tr style="cursor:pointer;--etat-c:'+coul+'" data-etat="'+st.k+'">'+
        '<td><div style="display:flex;gap:12px;align-items:center">'+vignette(x.c,42)+
          '<div><b>'+esc(x.c.nom)+'</b>'+(x.c.exemple?' <span class="chip warn">exemple</span>':'')+
          '<div class="hint" style="margin:2px 0 0">'+esc(dureeTexte(x.r.minutes))+' · '+esc(canal(x.c.canal).nom)+'</div></div></div></td>'+
        '<td class="n" data-l="Prix de vente">'+esc(eur(x.c.prix))+'</td>'+
        '<td class="n" data-l="Ce que ça te coûte">− '+esc(eur(sorties))+'</td>'+
        '<td class="n" data-l="Il te reste" style="color:'+(x.r.reste<0?'var(--bad)':'inherit')+';font-weight:600">'+esc(eur(x.r.reste))+'</td>'+
        '<td class="n" data-l="Par heure" style="font-weight:600;color:'+coul+'">'+esc(eur(x.r.gainHoraire))+'</td>'+
        '<td data-l="Travail en cours">'+(function(){
          var pc = pieceEnCours(x.c.id);
          if (!pc) return '<span class="hint">—</span>';
          var ch2 = chronoEnCours();
          var run = !!(ch2 && ch2.pid === pc.id);
          var mm = minutesMesurees(pc);
          return '<span class="etat '+(run?'e-rupture':'e-bas')+'"><span class="pastille"></span>'+
            (run ? 'en cours' : (mm>0.01 ? esc(dureeLisible(mm)) : 'commencée'))+'</span>';
        })()+'</td>'+
        '<td data-l="État"><span class="chip '+st.k+'">'+esc(st.t)+'</span></td>'+
        '<td class="n" data-l="En stock"><div class="lignestock">'+
          badgeEtat(etatFini(x.c), enStock(x.c.id) + " pc")+jauge(etatFini(x.c))+'</div></td>'+
      '</tr>'
    );
    tr.addEventListener("click", function(){ ouvrirFiche(x.c.id); });
    tb.appendChild(tr);
  });
  wrap.appendChild(t);
  main.appendChild(wrap);

  main.appendChild(el('<div class="legetat" style="margin-top:14px">'+
    '<span class="etat e-ok"><span class="pastille"></span>tu t\'y retrouves</span>'+
    '<span class="etat e-bas"><span class="pastille"></span>sous ton objectif horaire</span>'+
    '<span class="etat e-rupture"><span class="pastille"></span>très sous-payée ou à perte</span>'+
    '<span class="legnote">La ligne se lit comme une soustraction : prix de vente − ce que ça te coûte = ce qu\'il te reste, '+
    'pour le temps indiqué. « Ce que ça te coûte » réunit les matières, les frais de vente et les cotisations — '+
    'pas ton travail, qui est justement ce qui reste.</span></div>'));
  main.appendChild(el('<p class="hint" style="max-width:78ch">Classées de la moins payée à la mieux payée. Clique une ligne pour ouvrir la fiche.</p>'));
}

/* ═════ 10. FICHE CRÉATION ═════ */

function nouvelleFiche(){
  view.draft = creationDepuisModele("ami_moyen","",0,"direct");
  view.draft.nom = "";
  view.ficheId = null;
  aller("fiche");
}
function ouvrirFiche(id){
  var src = null;
  for (var i=0;i<state.creations.length;i++) if (state.creations[i].id===id) src = state.creations[i];
  if (!src) return;
  view.draft = clone(src);
  view.ficheId = id;
  aller("fiche");
}

/* La photo est enregistrée tout de suite, même si la fiche n'est pas validée :
   sinon l'image serait orpheline dans le stockage. */
function sauverBrouillonPhoto(){
  if (!view.ficheId || !view.draft) return;
  var reel = creation(view.ficheId);
  if (reel){ reel.photo = view.draft.photo; sauverTout(); }
}

function renderFiche(main){
  var d = view.draft;
  if (!d){ nouvelleFiche(); return; }

  var wrap = el('<div style="display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px;align-items:start" id="fiche-grid"></div>');
  var left = el('<div style="display:flex;flex-direction:column;gap:16px;min-width:0"></div>');
  var right = el('<div style="position:sticky;top:calc(env(safe-area-inset-top,0px) + 108px)" id="fiche-right"></div>');
  var mq = window.matchMedia("(max-width: 900px)");
  function adapter(){
    if (mq.matches){
      wrap.style.gridTemplateColumns = "1fr";
      right.style.position = "static";
      right.style.order = "-1";
    } else {
      wrap.style.gridTemplateColumns = "minmax(0,1fr) 340px";
      right.style.position = "sticky";
      right.style.order = "0";
    }
  }
  if (mq.addEventListener) mq.addEventListener("change", adapter);

  /* --- identité --- */
  var cId = el(
    '<div class="card"><div class="body">'+
      '<div class="grid2">'+
        '<label class="f"><span>Nom de la création</span><input id="f-nom" type="text" placeholder="Lapin gris, bonnet torsadé…"></label>'+
        '<label class="f"><span>Partir d\'un modèle du catalogue</span><select id="f-modele"></select></label>'+
      '</div>'+
      '<p class="hint">Le modèle pré-remplit les matières et les temps avec des ordres de grandeur. Corrige-les avec tes vrais chiffres — c\'est là que l\'outil devient juste.</p>'+
    '</div></div>'
  );
  left.appendChild(cId);
  left.appendChild(carteChrono(d, function(){ aller("fiche"); }));
  var cp = cartePatronPerso(d);
  if (cp) left.appendChild(cp);
  left.appendChild(blocPhoto(d, function(){
    sauverBrouillonPhoto();
    aller("fiche");
  }));

  /* --- matières --- */
  var cMat = el(
    '<div class="card"><header><h2>Ce que tu consommes</h2><p>La quantité réellement utilisée, pas le conditionnement acheté.</p></header>'+
    '<div class="body"><div id="f-rows" style="display:flex;flex-direction:column;gap:8px"></div></div></div>'
  );
  var addRow = el('<button type="button" class="btn sm primary" style="margin-top:12px">+ Ajouter une matière</button>');
  cMat.querySelector(".body").appendChild(addRow);
  left.appendChild(cMat);

  /* --- temps --- */
  var cTps = el(
    '<div class="card"><header><h2>Ton temps</h2><p>En minutes. Le poste « crochet » est rarement le plus sous-estimé — ce sont les autres.</p></header>'+
    '<div class="body"><div id="f-temps" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:12px"></div>'+
    '<div style="margin-top:14px;padding-top:12px;border-top:1px solid var(--rule);display:flex;justify-content:space-between;align-items:baseline;gap:10px">'+
    '<span>Temps total sur cette création</span><b class="num" id="f-tot" style="font-size:18px;font-weight:500">—</b></div></div></div>'
  );
  left.appendChild(cTps);

  /* --- temps réellement mesuré --- */
  var bt = view.ficheId ? bilanTemps(view.ficheId) : null;
  if (bt && bt.n > 0){
    var pct2 = Math.round(bt.ecart*100);
