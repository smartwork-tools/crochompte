<style>
  @font-face{font-family:"Bricolage Grotesque";font-style:normal;font-weight:600;font-display:swap;src:url("polices/bricolage-grotesque-latin-600-normal.woff2") format("woff2");}

  @font-face{font-family:"Bricolage Grotesque";font-style:normal;font-weight:800;font-display:swap;src:url("polices/bricolage-grotesque-latin-800-normal.woff2") format("woff2");}

<style>
  :root{
    --ground:#f4f3f0; --surface:#ffffff; --surface-2:#faf9f7;
    --ink:#1a1c1a; --muted:#6a6f6c; --rule:#e3e2dd; --rule-strong:#cdccc5;
    --primary:#0f5f57; --primary-ink:#0f5f57; --primary-soft:#e4efed; --on-primary:#ffffff;
    --good:#2f7d54; --good-soft:#e7f1ea;
    --warn:#9a6a0d; --warn-soft:#f6eeda;
    --bad:#b03a2b;  --bad-soft:#f8e9e6;
    --field:#ffffff;
    --s-1:#2a78d6; --s-2:#eb6834; --s-3:#1baf7a; --s-neutre:#9aa09c;
    --f-ami:#a8590f;     --f-ami-b:#fdf0dd;
    --f-bebe:#b1487a;    --f-bebe-b:#fdeaf2;
    --f-mode:#2b5da6;    --f-mode-b:#e7effb;
    --f-maison:#7d5327;  --f-maison-b:#f7eee2;
    --f-vegetal:#2f7145; --f-vegetal-b:#e7f3ea;
    --f-fete:#6b45a3;    --f-fete-b:#f0eafa;
    --f-perso:#a5323f;   --f-perso-b:#fce9eb;
    --hero:#0e3b37; --hero-ink:#eef6f4; --hero-muted:#a9cbc4; --hero-accent:#ffb4a2; --hero-ok:#9fe3c4;
  }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
    --ground:#121513; --surface:#1b1f1d; --surface-2:#171b19;
    --ink:#e9ebe8; --muted:#969e99; --rule:#2b302d; --rule-strong:#3c423e;
    --primary:#5fbfae; --primary-ink:#7fd0c0; --primary-soft:#15302c; --on-primary:#0b1513;
    --good:#6fb98d; --good-soft:#16281e;
    --warn:#d7a648; --warn-soft:#2a2316;
    --bad:#e28d79;  --bad-soft:#2d1d1a;
    --field:#121614;
    --s-1:#3987e5; --s-2:#d95926; --s-3:#199e70; --s-neutre:#6c7570;
    --f-ami:#e0a259;     --f-ami-b:#2c2115;
    --f-bebe:#e493b4;    --f-bebe-b:#2d1d24;
    --f-mode:#7ea6e8;    --f-mode-b:#18202f;
    --f-maison:#c69265;  --f-maison-b:#271e15;
    --f-vegetal:#74ba88; --f-vegetal-b:#17271b;
    --f-fete:#ae90dc;    --f-fete-b:#231b30;
    --f-perso:#dd858f;   --f-perso-b:#2c1b1e;
    --hero:#0d2e2b; --hero-ink:#e9f3f1; --hero-muted:#8fb3ad; --hero-accent:#f4a896; --hero-ok:#8fd6b6;
  }}
  :root[data-theme="dark"]{
    --ground:#121513; --surface:#1b1f1d; --surface-2:#171b19;
    --ink:#e9ebe8; --muted:#969e99; --rule:#2b302d; --rule-strong:#3c423e;
    --primary:#5fbfae; --primary-ink:#7fd0c0; --primary-soft:#15302c; --on-primary:#0b1513;
    --good:#6fb98d; --good-soft:#16281e;
    --warn:#d7a648; --warn-soft:#2a2316;
    --bad:#e28d79;  --bad-soft:#2d1d1a;
    --field:#121614;
    --s-1:#3987e5; --s-2:#d95926; --s-3:#199e70; --s-neutre:#6c7570;
    --f-ami:#e0a259;     --f-ami-b:#2c2115;
    --f-bebe:#e493b4;    --f-bebe-b:#2d1d24;
    --f-mode:#7ea6e8;    --f-mode-b:#18202f;
    --f-maison:#c69265;  --f-maison-b:#271e15;
    --f-vegetal:#74ba88; --f-vegetal-b:#17271b;
    --f-fete:#ae90dc;    --f-fete-b:#231b30;
    --f-perso:#dd858f;   --f-perso-b:#2c1b1e;
    --hero:#0d2e2b; --hero-ink:#e9f3f1; --hero-muted:#8fb3ad; --hero-accent:#f4a896; --hero-ok:#8fd6b6;
  }

  *{box-sizing:border-box;}
  [hidden]{display:none!important;}
  body{background:var(--ground);color:var(--ink);font-family:"Public Sans",system-ui,-apple-system,Segoe UI,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;}
  h1,h2,h3,h4{font-family:"Bricolage Grotesque","Public Sans",system-ui,sans-serif;font-weight:600;margin:0;text-wrap:balance;}
  .num{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums;}
  a{color:var(--primary-ink);}

  /* chrome */
  .topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--surface);border-bottom:1px solid var(--rule);}
  .topbar-in{max-width:1100px;margin:0 auto;padding:12px 20px 0;display:flex;flex-direction:column;gap:10px;}
  .brandrow{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;}
  .brand{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:19px;letter-spacing:-.02em;cursor:pointer;background:none;border:none;color:inherit;padding:0;}
  .brand span{color:var(--primary-ink);}
  .brandnote{font-size:12.5px;color:var(--muted);}
  #nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;}
  #nav::-webkit-scrollbar{display:none;}
  #nav button{appearance:none;background:none;border:none;font:inherit;font-weight:500;font-size:14px;color:var(--muted);cursor:pointer;padding:9px 13px 11px;border-bottom:2px solid transparent;white-space:nowrap;}
  #nav button[aria-current="true"]{color:var(--ink);border-bottom-color:var(--primary);}
  #nav button:hover{color:var(--ink);}

  /* Compte dans l'en-tête (ordinateur) : qui est connectée, et de quoi partir.
     Toujours au même endroit, comme sur tous les sites qu'on connaît. */
  .compte-entete{display:flex;align-items:center;gap:10px;margin-left:auto;}
  .compte-nom{display:flex;align-items:center;gap:8px;appearance:none;background:none;border:1px solid transparent;
    border-radius:99px;padding:3px 10px 3px 3px;font:inherit;font-size:14px;font-weight:500;color:var(--ink);cursor:pointer;max-width:220px;}
  .compte-nom:hover{border-color:var(--rule-strong);background:var(--surface-2);}
  .compte-nom .pseudo{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .avatar{width:28px;height:28px;border-radius:50%;flex:none;display:grid;place-items:center;
    background:var(--primary-soft);color:var(--primary-ink);font-weight:700;font-size:13px;text-transform:uppercase;}
  .hl-badge{font-size:12.5px;font-weight:600;color:var(--warn);background:var(--warn-soft);border-radius:99px;padding:4px 10px;}
  .menu-btn{display:none;align-items:center;gap:7px;appearance:none;background:var(--surface);border:1px solid var(--rule-strong);
    border-radius:8px;padding:7px 12px;font:inherit;font-size:14px;font-weight:600;color:var(--ink);cursor:pointer;min-height:42px;}
  .menu-btn:hover{background:var(--surface-2);}

  /* Menu du téléphone */
  .menu-mobile{position:fixed;inset:0;z-index:60;}
  .mm-fond{position:absolute;inset:0;background:rgba(10,14,12,.45);}
  .mm-panneau{position:absolute;top:0;right:0;bottom:0;width:min(340px,88vw);background:var(--surface);
    display:flex;flex-direction:column;box-shadow:-8px 0 30px rgba(0,0,0,.18);
    padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
  .mm-tete{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--rule);}
  .mm-fermer{appearance:none;background:none;border:none;color:var(--ink);cursor:pointer;width:42px;height:42px;
    display:grid;place-items:center;border-radius:8px;}
  .mm-fermer:hover{background:var(--surface-2);}
  .mm-liste{flex:1;overflow-y:auto;padding:8px;}
  .mm-liste button{display:flex;align-items:center;width:100%;appearance:none;background:none;border:none;
    font:inherit;font-size:16px;font-weight:500;color:var(--ink);text-align:left;cursor:pointer;
    padding:13px 14px;border-radius:9px;min-height:48px;}
  .mm-liste button:hover{background:var(--surface-2);}
  .mm-liste button[aria-current="true"]{background:var(--primary-soft);color:var(--primary-ink);font-weight:600;}
  .mm-compte{border-top:1px solid var(--rule);padding:14px 16px 18px;display:flex;flex-direction:column;gap:10px;}
  .mm-compte .qui{display:flex;align-items:center;gap:10px;font-weight:600;}
  .mm-compte .qui small{display:block;font-weight:400;color:var(--muted);font-size:12.5px;}
  .mm-compte .btn{width:100%;justify-content:center;min-height:46px;}
  body.menu-ouvert{overflow:hidden;}

  @media (max-width:720px){
    body.app-ouverte .menu-btn{display:inline-flex;}
    body.app-ouverte #nav{display:none;}
    body.app-ouverte .brandnote, body.app-ouverte .compte-entete{display:none!important;}
    .topbar-in{padding-bottom:12px;}
    .brandrow{flex-wrap:nowrap;}
  }
  main{max-width:1100px;margin:0 auto;padding:22px 20px 80px;}

  /* Réglages rangés par rubrique : la liste à gauche, la rubrique ouverte à
     droite (ordinateur) ; la liste d'abord, puis la rubrique (téléphone). */
  .reg{display:grid;grid-template-columns:250px minmax(0,1fr);gap:28px;align-items:start;}
  .reg-nav{position:sticky;top:112px;display:flex;flex-direction:column;gap:2px;}
  .reg-item{display:flex;flex-direction:column;gap:2px;width:100%;text-align:left;appearance:none;background:none;
    border:none;border-left:3px solid transparent;font:inherit;color:var(--ink);cursor:pointer;
    padding:10px 12px;border-radius:0 8px 8px 0;}
  .reg-item:hover{background:var(--surface-2);}
  .reg-item[aria-current="true"]{background:var(--primary-soft);border-left-color:var(--primary);}
  .ri-t{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:14.5px;}
  .ri-a{font-size:12.5px;color:var(--muted);line-height:1.35;}
  .ri-badge{font-size:11px;font-weight:600;letter-spacing:.01em;color:var(--warn);background:var(--warn-soft);
    border-radius:99px;padding:1px 8px;}
  .reg-tete{margin:0 0 16px;}
  .reg-tete h2{font-size:21px;margin:0 0 4px;}
  .reg-tete p{margin:0;color:var(--muted);max-width:65ch;}
  .reg-retour{appearance:none;background:none;border:none;font:inherit;font-weight:600;font-size:15px;
    color:var(--primary-ink);cursor:pointer;padding:8px 0;margin:0 0 8px;min-height:44px;}
  .card.zone-sensible{border-color:var(--bad);}
  .card.zone-sensible > header h2{color:var(--bad);}
  button.btn.danger{color:var(--bad);border-color:var(--bad);}
  button.btn.danger:hover{background:var(--bad-soft);}
  @media (max-width:720px){
    .reg{display:block;}
    .reg-liste .reg-nav{position:static;background:var(--surface);border:1px solid var(--rule);
      border-radius:12px;overflow:hidden;gap:0;}
    .reg-liste .reg-item{border-left:none;border-radius:0;border-bottom:1px solid var(--rule);
      padding:14px 44px 14px 16px;position:relative;min-height:62px;justify-content:center;}
    .reg-liste .reg-item::after{content:"›";position:absolute;right:18px;top:50%;transform:translateY(-50%);
      font-size:24px;line-height:1;color:var(--muted);}
    .reg-liste .reg-item:last-child{border-bottom:none;}
    .reg-liste .reg-item[aria-current="true"]{background:none;}
    .reg-detail .reg-nav{display:none;}
  }
  main.wide{max-width:1100px;}

  /* buttons + fields */
  button.btn{appearance:none;font:inherit;font-weight:500;font-size:14px;cursor:pointer;border-radius:7px;padding:8px 14px;border:1px solid var(--rule-strong);background:var(--surface);color:var(--ink);}
  button.btn:hover{border-color:var(--muted);}
  button.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--on-primary);}
  button.btn.primary:hover{filter:brightness(1.08);}
  button.btn.ghost{background:none;border-color:transparent;color:var(--muted);padding:6px 8px;}
  button.btn.ghost:hover{color:var(--bad);}
  button.btn.sm{padding:5px 10px;font-size:13px;}
  button.btn.lg{padding:12px 22px;font-size:15.5px;border-radius:8px;}
  button:focus-visible,a:focus-visible{outline:2px solid var(--primary);outline-offset:2px;}
  input,select{font:inherit;font-size:14px;color:var(--ink);background:var(--field);border:1px solid var(--rule-strong);border-radius:7px;padding:8px 10px;width:100%;}
  input:focus,select:focus{outline:2px solid var(--primary);outline-offset:-1px;border-color:var(--primary);}
  input[type=number]{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;}
  label.f{display:block;}
  label.f > span{display:block;font-size:12.5px;color:var(--muted);margin-bottom:5px;font-weight:500;}
  .hint{font-size:12.5px;color:var(--muted);margin:6px 0 0;}
  input[type=range]{-webkit-appearance:none;appearance:none;background:none;padding:0;border:none;height:26px;}
  input[type=range]::-webkit-slider-runnable-track{height:5px;border-radius:3px;background:var(--rule-strong);}
  input[type=range]::-moz-range-track{height:5px;border-radius:3px;background:var(--rule-strong);}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:var(--primary);border:3px solid var(--surface);margin-top:-8px;box-shadow:0 0 0 1px var(--rule-strong);cursor:grab;}
  input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--primary);border:3px solid var(--surface);box-shadow:0 0 0 1px var(--rule-strong);cursor:grab;}

  /* cards */
  .card{background:var(--surface);border:1px solid var(--rule);border-radius:10px;}
  .card > header{padding:16px 18px 0;}
  .card > header h2{font-size:16px;}
  .card > header p{margin:4px 0 0;font-size:13px;color:var(--muted);}
  .card > .body{padding:16px 18px 18px;}
  .grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;}
  .grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;}
  .banner{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--primary-soft);border:1px solid color-mix(in srgb,var(--primary) 22%,transparent);border-radius:8px;padding:11px 14px;margin-bottom:20px;font-size:13.5px;}
  .banner p{margin:0;flex:1 1 260px;}
  .chip{font-size:11px;font-weight:600;letter-spacing:.03em;padding:3px 8px;border-radius:20px;white-space:nowrap;display:inline-block;}
  .chip.good{background:var(--good-soft);color:var(--good);}
  .chip.warn{background:var(--warn-soft);color:var(--warn);}
  .chip.bad{background:var(--bad-soft);color:var(--bad);}
  .chip.neutral{background:var(--surface-2);color:var(--muted);border:1px solid var(--rule);}
  .hypo{display:inline-block;font-size:10px;font-weight:600;letter-spacing:.06em;background:var(--warn-soft);color:var(--warn);padding:2px 6px;border-radius:3px;vertical-align:1px;}
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:20px;}
  /* Indicateurs : deux groupes nommés plutôt qu'un mur de chiffres */
  .ind-groupe{font-family:"Public Sans",system-ui,sans-serif;font-size:12px;font-weight:600;text-transform:uppercase;
    letter-spacing:.07em;color:var(--muted);margin:22px 0 10px;}
  .ind-guide{margin:0;padding:0;list-style:none;counter-reset:etape;display:grid;gap:12px;}
  .ind-guide li{counter-increment:etape;display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:12px;align-items:center;
    padding:12px 0;border-top:1px solid var(--rule);}
  .ind-guide li:first-child{border-top:none;padding-top:0;}
  .ind-guide li::before{content:counter(etape);width:28px;height:28px;border-radius:50%;display:grid;place-items:center;
    background:var(--primary-soft);color:var(--primary-ink);font-weight:700;font-size:13px;}
  .ind-guide li p{margin:2px 0 0;font-size:13.5px;color:var(--muted);}
  .ind-source{margin-top:22px;padding:14px 16px;border-radius:10px;background:var(--surface-2);border:1px solid var(--rule);
    font-size:13px;color:var(--muted);max-width:85ch;}
  .ind-source p{margin:0 0 6px;} .ind-source p:last-child{margin:0;}
  @media (max-width:560px){ .ind-guide li{grid-template-columns:32px minmax(0,1fr);align-items:start;} .ind-guide li .btn{grid-column:2;justify-self:start;} }
  .tile{background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:14px 16px;}
  .tile .k{font-size:12px;color:var(--muted);font-weight:500;}
  .tile .v{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;font-size:24px;line-height:1.2;margin-top:6px;letter-spacing:-.02em;white-space:nowrap;}
  /* Un chiffre d'affaires à cinq chiffres ne doit pas renvoyer le « € » à la
     ligne suivante : la valeur rétrécit au lieu de se casser. */
  .tile .v.long{font-size:19px;}
  .tile .v.plus-long{font-size:16.5px;}
  .tile .v.tres-long{font-size:14.5px;}
  .tile .v.good{color:var(--good);} .tile .v.bad{color:var(--bad);} .tile .v.warn{color:var(--warn);}
  .tile .s{font-size:12px;color:var(--muted);margin-top:4px;}
  .sechead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:26px 0 12px;}
  .pagehead{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin:0 0 20px;}
  .pagehead h1{font-size:23px;letter-spacing:-.02em;line-height:1.2;}
  .pagehead p{margin:5px 0 0;color:var(--muted);font-size:14px;max-width:62ch;}
  .pagehead .ph-act{display:flex;gap:8px;flex-wrap:wrap;}
  .vide{background:var(--surface);border:1px dashed var(--rule-strong);border-radius:12px;
    padding:34px 24px;text-align:center;}
  .vide h2{font-size:17px;}
  .vide p{margin:8px auto 0;color:var(--muted);max-width:52ch;font-size:14.5px;}
  .vide .v-act{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px;}
  .sechead h2{font-size:17px;}
  .tablewrap{overflow-x:auto;border:1px solid var(--rule);border-radius:10px;background:var(--surface);}
  table{border-collapse:collapse;width:100%;min-width:640px;font-size:13.5px;}
  th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--rule);vertical-align:middle;}
  thead th{font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:600;white-space:nowrap;background:var(--surface-2);}
  tbody tr:last-child td{border-bottom:none;}
  td.n,th.n{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap;}
  td input,td select{padding:5px 7px;font-size:13px;}
  .catrow td{background:var(--surface-2);font-weight:600;font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);}
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 22px);background:var(--ink);color:var(--ground);padding:10px 18px;border-radius:24px;font-size:13.5px;font-weight:500;z-index:80;box-shadow:0 4px 18px rgba(0,0,0,.18);}
  textarea{width:100%;font-family:"IBM Plex Mono",monospace;font-size:12px;border:1px solid var(--rule-strong);border-radius:7px;padding:10px;background:var(--field);color:var(--ink);min-height:110px;resize:vertical;}
  .savebar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:4px;}
  .seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--rule);border-radius:8px;padding:3px;gap:3px;}
  .seg button{appearance:none;border:none;background:none;font:inherit;font-size:13.5px;font-weight:500;color:var(--muted);padding:6px 14px;border-radius:6px;cursor:pointer;}
  .seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.06);}

  /* ── boîte de confirmation ──
     Pour tout ce qui ne se rattrape pas : un titre qui dit ce qui va se passer,
     le détail de ce qui sera perdu, et deux boutons nommés par leur effet. */
  .dlg-fond{position:fixed;inset:0;z-index:90;background:rgba(10,14,12,.5);display:grid;place-items:center;padding:16px;}
  .dlg{background:var(--surface);color:var(--ink);border-radius:14px;max-width:470px;width:100%;
    box-shadow:0 18px 50px rgba(0,0,0,.28);padding:22px 22px 18px;max-height:calc(100vh - 32px);overflow:auto;}
  .dlg h2{font-size:19px;margin:0 0 10px;line-height:1.25;}
  .dlg p{margin:0 0 10px;font-size:14.5px;}
  .dlg ul{margin:0 0 12px;padding-left:20px;color:var(--muted);font-size:14px;display:flex;flex-direction:column;gap:4px;}
  .dlg .dlg-saisie{margin-top:14px;}
  .dlg .dlg-saisie b{font-family:"IBM Plex Mono",monospace;font-weight:500;background:var(--surface-2);padding:1px 6px;border-radius:4px;border:1px solid var(--rule);}
  .dlg .dlg-act{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:18px;}
  button.btn.danger-plein{background:var(--bad);border-color:var(--bad);color:#fff;}
  button.btn.danger-plein:hover{filter:brightness(1.06);}
  button.btn[disabled]{opacity:.5;cursor:not-allowed;filter:none;}
  button.btn.ghost.danger-texte{color:var(--bad);}
  button.btn.ghost.danger-texte:hover{background:var(--bad-soft);}
  @media (max-width:560px){
    .dlg-fond{align-items:end;padding:0;}
    .dlg{border-radius:16px 16px 0 0;max-width:none;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px));}
    .dlg .dlg-act{flex-direction:column-reverse;}
    .dlg .dlg-act .btn{width:100%;min-height:46px;}
  }
  .toast{display:flex;align-items:center;gap:14px;max-width:calc(100vw - 32px);}
  .toast button{appearance:none;background:none;border:none;font:inherit;font-weight:700;color:var(--primary-soft);
    cursor:pointer;padding:4px 2px;text-decoration:underline;text-underline-offset:3px;white-space:nowrap;}

  /* ── accueil ── */
  .foot{max-width:1060px;margin:44px auto 0;padding:22px 20px 0;border-top:1px solid var(--rule);font-size:12.5px;color:var(--muted);}
  /* Écran de connexion */
  .portail{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,440px);gap:48px;align-items:start;padding:28px 0 60px;}
  .portail-pres{padding-top:18px;}

  .portail-pres .lede{font-size:16.5px;color:var(--muted);margin:16px 0 0;max-width:54ch;}
  .portail-points{list-style:none;margin:26px 0 0;padding:0;display:flex;flex-direction:column;gap:16px;}
  .portail-points li{display:grid;grid-template-columns:26px minmax(0,1fr);column-gap:12px;}
  .portail-points li::before{content:"✓";grid-row:1 / span 2;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;
    background:var(--primary-soft);color:var(--primary-ink);font-weight:700;font-size:13px;}
  .portail-points b{font-size:15px;}
  .portail-points span{font-size:14px;color:var(--muted);}

    .portail-pres{padding-top:0;}
  }

  /* Formulaires de connexion */
  .card.auth > .body{padding:26px 26px 24px;}
  .auth-titre{font-size:24px;letter-spacing:-.02em;margin:0;}
  .auth-sous{margin:6px 0 18px;color:var(--muted);font-size:14.5px;}
  .auth form{display:flex;flex-direction:column;gap:14px;}
  .auth-champ label.f > span{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:13.5px;color:var(--ink);font-weight:600;margin-bottom:6px;}
  .auth-champ input{font-size:16px;padding:11px 12px;min-height:46px;}
  .auth-champ .hint{margin:5px 0 0;}
  .auth-lien-label{font-weight:500;font-size:13px;}
  .auth-etat{min-height:0;}
  .auth-etat:empty{display:none;}
  .auth-etat.ok{color:var(--good);} .auth-etat.ko{color:var(--bad);}
  .mdp{position:relative;display:block;}
  .mdp input{padding-right:92px;}
  .mdp-voir{position:absolute;right:6px;top:50%;transform:translateY(-50%);appearance:none;background:none;border:none;
    font:inherit;font-size:13px;font-weight:600;color:var(--primary-ink);cursor:pointer;padding:8px 10px;border-radius:6px;}
  .mdp-voir:hover{background:var(--surface-2);}
  input[aria-invalid="true"]{border-color:var(--bad);outline:2px solid var(--bad);outline-offset:-1px;}
  .auth-case{display:flex;gap:10px;align-items:center;cursor:pointer;font-size:14.5px;}
  .auth-case input{width:20px;height:20px;min-height:0;margin:0;flex:none;accent-color:var(--primary);}
  .auth-btn{width:100%;min-height:48px;font-size:15.5px;font-weight:600;margin-top:4px;}
  .auth-legal{margin:16px 0 0;line-height:1.5;}
  .auth-bas{margin:18px 0 0;padding-top:16px;border-top:1px solid var(--rule);text-align:center;font-size:14.5px;}
  .auth-etapes{margin:4px 0 18px;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:14.5px;}
  .banner.auth-erreur{background:var(--bad-soft);border-color:color-mix(in srgb,var(--bad) 35%,transparent);}
  .banner.auth-erreur p, .banner.auth-erreur b{color:var(--ink);}
  @media (max-width:560px){ .card.auth > .body{padding:20px 18px;} }
  /* Mon compte */
  .compte-carte{margin-bottom:16px;}
  .compte-infos{margin:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;}
  .compte-infos dt{font-size:12.5px;color:var(--muted);font-weight:500;}
  .compte-infos dd{margin:2px 0 0;font-weight:600;overflow-wrap:anywhere;}
  .compte-hist{margin-top:14px;padding-top:12px;border-top:1px solid var(--rule);}
  .compte-hist-ligne{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--rule);font-size:14px;}
  .compte-carte .auth-champ input{font-size:15px;min-height:42px;padding:9px 11px;}
  .compte-carte form{display:flex;flex-direction:column;gap:12px;}
  .compte-carte .grid2 .auth-champ{min-width:0;}

  .plus-lignes{display:flex;gap:14px;align-items:center;justify-content:center;flex-wrap:wrap;margin-top:14px;}

  /* Visionneuse de pages */
  .visio{position:fixed;inset:0;z-index:95;background:rgba(10,14,12,.92);display:flex;flex-direction:column;}
  .visio-barre{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 14px;
    padding-top:calc(10px + env(safe-area-inset-top,0px));background:var(--surface);border-bottom:1px solid var(--rule);}
  .visio-num{margin-right:auto;font-weight:600;font-size:14px;}
  .visio-page{flex:1;overflow:auto;padding:12px;-webkit-overflow-scrolling:touch;}
  .visio-page img{display:block;width:100%;max-width:1100px;margin:0 auto;background:#fff;border-radius:4px;}

  /* Tableau de bord */
  /* ─── Accueil : la bande verte, puis le tableau de bord ─── */
  .acc-hero{background:var(--hero);color:var(--hero-ink);margin:-22px -20px 22px;padding:48px 32px 46px;border-radius:0 0 18px 18px;}
  .acc-hero-in{max-width:1060px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:44px;align-items:center;}
  .acc-hero .eyebrow{font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--hero-muted);}
  .acc-hero h1{font-size:clamp(30px,4.6vw,46px);line-height:1.06;letter-spacing:-.03em;margin:12px 0 0;font-weight:700;color:var(--hero-ink);text-wrap:balance;}
  .acc-hero h1 .suite{display:block;color:var(--hero-muted);font-weight:600;}
  .acc-hero h1 .chiffre{color:var(--hero-ink);white-space:nowrap;}
  .acc-hero p.lede{font-size:17px;line-height:1.55;color:var(--hero-muted);margin:16px 0 0;max-width:50ch;}
  .acc-hero .cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:26px;}
  .acc-hero .cta .btn{background:var(--hero-ink);color:var(--hero);border-color:var(--hero-ink);}
  .acc-hero .cta .btn.alt{background:transparent;color:var(--hero-ink);border-color:var(--hero-muted);}
  .acc-hero .btn:focus-visible{outline:3px solid var(--hero-ok);outline-offset:2px;}
  .preuve{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.15);border-radius:14px;padding:22px;}
  .preuve .t{font-size:12.5px;color:var(--hero-muted);}
  .preuve .t b{color:var(--hero-ink);font-weight:600;}
  .preuve .rows{margin-top:10px;}
  .preuve .row{display:flex;justify-content:space-between;gap:12px;font-size:13.5px;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.1);}
  .preuve .row:last-child{border-bottom:none;}
  .preuve .row span:last-child{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;}
  .preuve .big{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;font-size:36px;letter-spacing:-.03em;margin-top:12px;color:var(--hero-accent);}
  .preuve .big.ok{color:var(--hero-ok);}
  .preuve .cap{font-size:12.5px;color:var(--hero-muted);margin-top:4px;}
  .preuve .lien{margin-top:12px;background:none;border:none;padding:0;color:var(--hero-ink);font:inherit;font-size:13.5px;
    font-weight:600;text-decoration:underline;text-underline-offset:3px;cursor:pointer;}
  @media (max-width:820px){ .acc-hero-in{grid-template-columns:minmax(0,1fr);gap:28px;} .acc-hero{padding:32px 20px 30px;} }

  .depart{margin-bottom:22px;}
  .depart-tete{display:flex;justify-content:space-between;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:12px;}
  .depart-tete h2{font-size:19px;letter-spacing:-.01em;}
  .depart-tete span{font-size:13px;color:var(--muted);}
  .depart-grille{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;}
  .dep{background:var(--surface);border:1px solid var(--rule);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:8px;}
  .dep .num{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-family:"IBM Plex Mono",monospace;font-size:13px;
    background:var(--primary);color:var(--on-primary);}
  .dep h3{font-size:15.5px;margin-top:4px;}
  .dep p{margin:0;font-size:13.5px;color:var(--muted);flex:1;}
  .dep .btn{align-self:flex-start;margin-top:6px;}
  .dep.fait{background:var(--surface-2);}
  .dep.fait .num{background:var(--good-soft);color:var(--good);}
  .dep.fait h3{color:var(--muted);}
  .dep .ok{font-size:13px;font-weight:600;color:var(--good);margin-top:6px;}
  @media (max-width:760px){
    .depart-grille{grid-template-columns:minmax(0,1fr);gap:10px;}
    .dep.fait{flex-direction:row;align-items:center;padding:12px 16px;}
    .dep.fait h3{margin:0;flex:1;font-size:14.5px;}
    .dep.fait p{display:none;}
    .dep.fait .ok{margin:0;}
  }

  .todo .ico{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-weight:700;font-size:14px;
    background:var(--primary-soft);color:var(--primary-ink);}
  .todo .ico.bad{background:var(--bad-soft);color:var(--bad);} .todo .ico.warn{background:var(--warn-soft);color:var(--warn);}
  .todo li.avec-ico{grid-template-columns:30px minmax(0,1fr) auto;}
  @media (max-width:560px){ .todo li.avec-ico{grid-template-columns:30px minmax(0,1fr);} }
  .dash-bloc{margin-bottom:18px;}
  .dash-grid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:18px;align-items:start;}
  .dash-col{display:flex;flex-direction:column;gap:18px;min-width:0;}
  @media (max-width:880px){ .dash-grid{grid-template-columns:minmax(0,1fr);} }
  .todo{list-style:none;margin:0;padding:0;}
  .todo li{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--rule);}
  .todo li:first-child{border-top:none;padding-top:2px;}
  .todo li:last-child{padding-bottom:0;}
  .todo .pt{width:10px;height:10px;border-radius:50%;background:var(--primary);}
  .todo .pt.bad{background:var(--bad);} .todo .pt.warn{background:var(--warn);}
  .todo b{display:block;font-size:14.5px;line-height:1.35;}
  .todo .d{display:block;font-size:13px;color:var(--muted);margin-top:2px;}
  @media (max-width:560px){ .todo li{grid-template-columns:10px minmax(0,1fr);} .todo li .btn{grid-column:2;justify-self:start;} }
  .dash-tiles{margin:0;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));}
  .crea-mini{display:flex;flex-direction:column;gap:8px;}
  .crea-mini .trow{width:100%;text-align:left;font:inherit;color:inherit;}
  .crea-mini .trow .c b.good{color:var(--good);} .crea-mini .trow .c b.warn{color:var(--warn);} .crea-mini .trow .c b.bad{color:var(--bad);}
  .ind-guide li.fait::before{content:"✓";background:var(--good-soft);color:var(--good);}
  .ind-guide li.fait b{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--rule-strong);}
  main .foot{margin-top:36px;padding-left:0;padding-right:0;}

  /* ── catalogue ── */
  .filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:18px;}
  .fchip{appearance:none;font:inherit;font-size:13px;font-weight:500;padding:6px 12px;border-radius:20px;border:1px solid var(--rule-strong);background:var(--surface);color:var(--muted);cursor:pointer;}
  .fchip[aria-pressed="true"]{background:var(--primary);border-color:var(--primary);color:var(--on-primary);}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;}
  .mcard{background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:16px;text-align:left;cursor:pointer;font:inherit;color:inherit;display:flex;flex-direction:column;gap:9px;}
  .mcard:hover{border-color:var(--muted);}
  .mcard .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;}
  .mcard h3{font-size:15px;line-height:1.25;}
  .mcard .meta{font-size:12px;color:var(--muted);}
  .mcard .figs{display:flex;gap:14px;margin-top:2px;padding-top:9px;border-top:1px solid var(--rule);}
  .mcard .fig{flex:1;}
  .mcard .fig b{display:block;font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;
    font-size:15px;font-weight:500;white-space:nowrap;}
  .mcard h3{flex:1;min-width:0;}
  .mcard .meta{white-space:normal;}
  .mcard .fig span{font-size:11px;color:var(--muted);}
  .diff{display:inline-flex;gap:2px;}
  .diff i{width:5px;height:5px;border-radius:50%;background:var(--rule-strong);display:block;}
  .diff i.on{background:var(--primary);}
  .mcard .top{align-items:center;}
  /* Pastille d'illustration : le fond prend la couleur de la famille. */
  .mot{border-radius:11px;padding:6px;display:flex;align-items:center;justify-content:center;}
  .mot.grand{border-radius:14px;padding:11px;}
  .f-ami .motif,.mot.f-ami{background:var(--f-ami-b);}
  .f-bebe .motif,.mot.f-bebe{background:var(--f-bebe-b);}
  .f-mode .motif,.mot.f-mode{background:var(--f-mode-b);}
  .f-maison .motif,.mot.f-maison{background:var(--f-maison-b);}
  .f-vegetal .motif,.mot.f-vegetal{background:var(--f-vegetal-b);}
  .f-fete .motif,.mot.f-fete{background:var(--f-fete-b);}
  .f-perso .motif,.mot.f-perso{background:var(--f-perso-b);}
  .mot .motif{background:none!important;}

  /* Vignette : photo de l'artisane si elle existe, sinon l'illustration. */
  .vignette{position:relative;display:inline-flex;align-items:center;justify-content:center;
    border-radius:10px;overflow:hidden;flex:none;}
  .vignette img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
  .vignette.a-photo .motif{display:none;}
  .photorow{display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap;}
  .photoslot{position:relative;width:104px;height:104px;border-radius:14px;overflow:hidden;
    display:flex;align-items:center;justify-content:center;flex:none;border:1px solid var(--rule);}
  .photoslot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
  .photoslot.a-photo .motif{display:none;}
  .photoact{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-start;flex:1 1 220px;}

  /* Codes couleur d'état de stock : une pastille, un mot, une jauge. */
  .etat{display:inline-flex;align-items:center;gap:7px;white-space:nowrap;}
  .pastille{width:9px;height:9px;border-radius:50%;flex:none;}
  .e-ok .pastille{background:var(--good);}   .e-ok{color:var(--good);}
  .e-bas .pastille{background:var(--warn);}  .e-bas{color:var(--warn);}
  .e-rupture .pastille{background:var(--bad);} .e-rupture{color:var(--bad);}
  .e-libre .pastille{background:var(--rule-strong);} .e-libre{color:var(--muted);}
  .jauge{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;min-width:56px;margin-top:5px;}
  .jauge > i{display:block;height:100%;border-radius:3px;}
  .lignestock{display:flex;flex-direction:column;gap:0;}
  /* Liseré de couleur sur la ligne : l'état se voit avant même de lire. */
  tbody tr[data-etat] td:first-child{box-shadow:inset 3px 0 0 var(--etat-c);}
    /* Ce qui change vraiment sur un écran étroit. */
@media (max-width:720px){
    .planche{border-radius:10px;}
    .resp tbody tr[data-etat]{border-left:3px solid var(--etat-c);}
    .resp tbody tr[data-etat] td:first-child{box-shadow:none;}
  }
  /* ─────────────────────────────────────────────────────────────────
     Ces règles étaient enfermées par erreur dans la requête « écran
     étroit » ci-dessus : une accolade mal placée. Résultat, sur un
     ordinateur, la mise en route, le catalogue en liste, les cartes de
     patrons et le compteur de rangs s'affichaient entièrement sans
     style. Elles sont désormais au bon niveau, donc actives partout.
     ───────────────────────────────────────────────────────────────── */
    .brefs{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:2px 18px;margin:0;}
    .brefs > div{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:baseline;
      padding:9px 0;border-bottom:1px solid var(--rule);}
    .brefs dt{color:var(--muted);font-size:13.5px;margin:0;}
    .brefs dd{margin:0;font-weight:600;font-size:14px;text-align:right;}
    .dessinlab{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;margin:10px 0 0;
      font-size:13px;color:var(--muted);line-height:1.5;}
    /* Liste des types d'ouvrage : une ligne, pas une affiche */
    .types{display:grid;gap:8px;}
    .trow{display:grid;grid-template-columns:34px 1fr auto;gap:12px;align-items:center;
      width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer;
      border:1px solid var(--rule);border-radius:11px;padding:11px 14px;background:var(--card);}
    .trow:hover{border-color:var(--rule-strong);background:var(--surface-2);}
    .trow .mot{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;flex:none;}
    .trow h3{margin:0;font-size:15px;font-weight:600;line-height:1.35;}

    .trow .c span{color:var(--muted);font-size:12px;}
    .segs{display:inline-flex;border:1px solid var(--rule-strong);border-radius:10px;
      overflow:hidden;margin-bottom:16px;}
    .segs button{appearance:none;border:none;font:inherit;font-size:14px;font-weight:500;
      padding:9px 16px;background:var(--surface);color:var(--ink);cursor:pointer;}
    .segs button+button{border-left:1px solid var(--rule);}
    .segs button[aria-pressed=true]{background:var(--primary);color:#fff;}
    .pat-lib{display:grid;gap:12px;}
    .pcard{display:grid;grid-template-columns:76px 1fr auto;gap:14px;align-items:center;
      border:1px solid var(--rule);border-radius:12px;padding:12px 14px;background:var(--card);}
    .pcard .vig{width:76px;height:60px;border-radius:8px;overflow:hidden;background:var(--surface-2);
      display:grid;place-items:center;flex:none;}

    .pcard .vig span{font-size:11px;color:var(--muted);}
    .pcard h3{margin:0;font-size:15px;font-weight:600;}
    .pcard .m{margin:2px 0 0;font-size:12.5px;color:var(--muted);}
    .pages{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:12px;}
    .pages figure{margin:0;border:1px solid var(--rule);border-radius:10px;overflow:hidden;background:var(--surface-2);}
    .pages img{width:100%;display:block;cursor:zoom-in;}
    .pages figcaption{display:flex;justify-content:space-between;align-items:center;
      padding:6px 9px;font-size:12px;color:var(--muted);}
    .cptr{display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
    .cptr .n{font-variant-numeric:tabular-nums;font-size:40px;font-weight:700;line-height:1;min-width:2.4ch;text-align:center;}
    .cptr button.rond{width:52px;height:52px;border-radius:50%;font-size:24px;line-height:1;padding:0;}
    .lecture{white-space:pre-wrap;font-size:15.5px;line-height:1.75;margin:0;}
    .zoneTap{display:block;width:100%;border:2px dashed var(--rule-strong);border-radius:16px;
      background:var(--surface-2);color:var(--ink);font:inherit;cursor:pointer;
      padding:26px 18px;text-align:center;transition:background .1s,border-color .1s;}
    .zoneTap:active{background:var(--good-soft);border-color:var(--good);}
    .zoneTap .gros{display:block;font-size:56px;font-weight:700;line-height:1;
      font-variant-numeric:tabular-nums;}
    .zoneTap .sous{display:block;margin-top:8px;font-size:13.5px;color:var(--muted);}
    .mlbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px;}
    .ecoute{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--muted);}
    .ecoute .pt{width:9px;height:9px;border-radius:50%;background:var(--rule-strong);}

    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
    @media (prefers-reduced-motion: reduce){ .ecoute.on .pt{animation:none;} }
    /* Mise en route : la liste de ce qu'il reste à alimenter */
    .etapes{display:grid;gap:14px;}
    .etape{display:grid;grid-template-columns:34px 1fr;gap:14px;align-items:start;
      border:1px solid var(--rule);border-radius:14px;padding:16px;background:var(--card);}
    .etape.fait{border-color:var(--good);background:var(--good-soft);}
    .et-n{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;
      font-weight:700;font-size:14px;background:var(--rule);color:var(--muted);}
    .etape.fait .et-n{background:var(--good);color:#fff;}
    .et-t{font-weight:650;font-size:16px;margin:0 0 4px;display:flex;gap:8px;
      align-items:center;flex-wrap:wrap;}
    .et-p{margin:0 0 10px;color:var(--muted);font-size:14px;line-height:1.55;}
    .et-act{display:flex;gap:8px;flex-wrap:wrap;}
    .jauge{height:8px;border-radius:99px;background:var(--rule);overflow:hidden;margin:8px 0 10px;}
    .jauge > i{display:block;height:100%;background:var(--good);border-radius:99px;}
    /* Import groupé de photos */
    .imp{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;}
    .impc{border:1px solid var(--rule);border-radius:12px;overflow:hidden;background:var(--card);}
    .impc img{width:100%;height:132px;object-fit:cover;display:block;background:var(--rule);}
    .impc .b{padding:10px;display:grid;gap:8px;}
    .impc select{width:100%;}
    .impc .fn{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  /* Niveau de difficulté : trois segments, pas trois points façon menu. */
  .niv{display:inline-flex;gap:2px;vertical-align:1px;margin-right:5px;}

  .niv i.on{background:var(--primary);}
  .compte{font-size:12.5px;color:var(--muted);margin:0 0 14px;}
  .fchip .n{opacity:.65;font-variant-numeric:tabular-nums;}
  /* Sélecteur de matière : on cherche, on clique, c'est fini. */
  .picker-ov{position:fixed;inset:0;z-index:90;background:rgba(15,20,18,.5);
    display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px 16px;}

    color:var(--muted);padding:14px 6px 7px;}

    font:inherit;color:inherit;background:none;border:1px solid transparent;border-radius:9px;
    padding:10px 12px;cursor:pointer;}
  .pk-item:hover,.pk-item:focus-visible{background:var(--surface-2);border-color:var(--rule);}
  .pk-n{font-weight:600;font-size:14.5px;}
  .pk-d{font-size:12.5px;color:var(--muted);grid-column:1;}
  .pk-p{grid-row:1/3;grid-column:2;text-align:right;font-size:14px;align-self:center;}
  .pk-p small{display:block;font-family:"Public Sans",sans-serif;font-size:11.5px;color:var(--muted);}
  .picker > footer{padding:11px 16px;border-top:1px solid var(--rule);background:var(--surface-2);}
  .matpick{text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  /* Bandeau photo d'une carte de modèle. Vide, il le dit. */
  .band{position:relative;display:block;aspect-ratio:16/10;border-radius:9px;overflow:hidden;
    margin:-4px -4px 4px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px;}
  .band img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}

    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

  .band.vide.f-mode{background:var(--f-mode-b);} .band.vide.f-maison{background:var(--f-maison-b);}
  .band.vide.f-vegetal{background:var(--f-vegetal-b);} .band.vide.f-fete{background:var(--f-fete-b);}
  .band.vide.f-perso{background:var(--f-perso-b);}
  .photoslot.grand{width:150px;height:150px;}
  .slot-lab{position:absolute;bottom:8px;left:0;right:0;text-align:center;font-size:10.5px;

  @media (max-width:520px){ .picker-ov{padding:0;} .picker{max-height:100vh;border-radius:0;width:100%;} }
  /* Chronomètre : visible partout tant qu'il tourne. */
  .chronobar{position:fixed;left:50%;transform:translateX(-50%);z-index:85;

    background:var(--ink);color:var(--ground);box-shadow:0 6px 26px rgba(0,0,0,.28);
    max-width:calc(100vw - 24px);}
  .chronobar .cb-pt{width:9px;height:9px;border-radius:50%;background:#e35d4a;flex:none;
    animation:bat 1.6s ease-in-out infinite;}
  @keyframes bat{0%,100%{opacity:1}50%{opacity:.25}}
  .chronobar .cb-txt{display:flex;flex-direction:column;min-width:0;line-height:1.25;}
  .chronobar .cb-txt b{font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:34vw;}
  .chronobar .cb-txt span{font-size:11.5px;opacity:.7;}
  .chronobar .cb-t{font-size:19px;font-variant-numeric:tabular-nums;letter-spacing:-.01em;}
  .chronobar .btn{background:none;border-color:currentColor;color:inherit;}
  /* Discret au repos, franc quand il tourne : un seul bouton doit attirer l'oeil. */
  .btn.chrono{padding:6px 12px;white-space:nowrap;color:var(--primary-ink);border-color:var(--rule-strong);}
  .btn.chrono:hover{border-color:var(--primary);}
  .btn.chrono.on{background:#c0432f;border-color:#c0432f;color:#fff;}
  /* Le chronomètre, en tête de fiche : c'est le geste quotidien. */
  .chrono-card{border-color:var(--rule-strong);}

  .ch-haut{display:flex;gap:18px;align-items:center;justify-content:space-between;flex-wrap:wrap;}
  .ch-info{min-width:0;}
  .ch-lab{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);}
  .ch-big{font-size:36px;line-height:1.1;letter-spacing:-.03em;margin:4px 0 2px;}
  .chrono-card.actif .ch-big{color:#c0432f;}
  .ch-sous{font-size:13px;color:var(--muted);max-width:52ch;}
  .ch-act{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
  .ch-bas{display:flex;gap:16px;flex-wrap:wrap;margin-top:14px;padding-top:12px;border-top:1px solid var(--rule);}
  .ch-poste{font-size:12.5px;color:var(--muted);}
  .ch-poste b{font-family:"IBM Plex Mono",monospace;color:var(--ink);font-weight:500;}
  @media (max-width:560px){ .ch-haut{flex-direction:column;align-items:stretch;gap:14px;}
    .ch-act{width:100%;} .ch-act .btn{flex:1;} }
  .tpsbox{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;}
  .tpsbox .c{background:var(--surface-2);border:1px solid var(--rule);border-radius:9px;padding:12px 14px;}
  .tpsbox .c b{display:block;font-family:"IBM Plex Mono",monospace;font-size:19px;font-weight:500;margin-top:3px;}
  .tpsbox .c span{font-size:12px;color:var(--muted);}
  /* Le patron : du texte fait pour être suivi les mains occupées, et imprimé. */
  .pat-meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:14px;}
  .pat-meta > div{background:var(--surface-2);border:1px solid var(--rule);border-radius:9px;padding:10px 13px;}
  .pat-meta span{display:block;font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);}

  ol.pat-rangs li:hover{border-left-color:var(--primary);background:var(--surface-2);}
  ul.pat-astuces{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:7px;font-size:14px;}

  .pat-droits{border-top:1px solid var(--rule);padding-top:12px;margin-top:18px;}

    body.mode-impression .savebar, body.mode-impression .pat-abbr summary{display:none!important;}

  .legetat{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;margin:0 0 12px;font-size:12.5px;}

  @media (max-width:720px){

    .resp td:not([data-l])::before{display:none;}
    .resp td.n{text-align:right;justify-items:end;}
    .resp td.n > *{justify-self:end;}
    .resp tbody tr.catrow{border:none;background:none;padding:14px 0 2px;margin:0;}

    .resp tr.catrow td::before{display:none;}
    .tablewrap.resp{border:none;background:none;overflow:visible;}

    button.btn, .fchip, .seg button{min-height:42px;}

    td input, td select{min-height:42px;font-size:14px;}
    #nav button{padding:12px 13px 13px;}
    a.src{min-height:64px;}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}
</style>

function mLignes(m){ return m[5].map(function(l){ return {mid:l[0], qte:l[1]}; }); }
function mTemps(m){ return {prep:m[6][0], crochet:m[6][1], assemb:m[6][2], finition:m[6][3], emball:m[6][4]}; }

function retirerMatiere(mid){
  state.matieres = state.matieres.filter(function(x){ return x.id !== mid; });
  if (MATIERES_DEFAUT.some(function(m){ return m[0] === mid; })){
    if (!state.matieresRetirees) state.matieresRetirees = {};
    state.matieresRetirees[mid] = true;
  }
}
function matieresDefaut(){
  return MATIERES_DEFAUT.map(function(m){
    return {id:m[0], nom:m[1], cat:m[2], prix:m[3], contenance:m[4], unite:m[5],
            stock:0, seuil:0, pmp:m[3]/m[4], mouv:[],
            refCat:null, fibre:"", composition:"", grosseur:m[6]||"", metrage:null,
            crochetMin:null, crochetMax:null, bain:"",
            prixIndicatif:true, perso:false, maj:null};
  });
}

function creationDepuisModele(modeleId, nom, prix, canal){
  var m = modele(modeleId);
  return {id:uid(), nom:nom || (m[0]==="vide" ? "" : mNom(m)), modele:m[0],
          lignes:mLignes(m), temps:mTemps(m), canal:canal||"direct",
          prix:prix||0, expedition:0, seuilFini:0, migre:true, photo:null};
}

function etatInitial(){
  var s = {
    reglages:{tauxHoraire:15, tauxPerte:8, cotisations:12.3, fraisFixes:0, piecesParMois:10,
              baseCout:"dernier", profil:"vend", mode:"simple",
              /* Heures de crochet réellement disponibles par jour : c'est ce
                 qui transforme « 14 commandes » en « tu ne tiendras pas ». */
              heuresParJour:3,
              /* Ce qui figure en haut des factures. Vide au départ : mieux
                 vaut un crochet visible qu'un nom inventé. */
              raisonSociale:"", adresse:"", siret:"", contact:""},
    canaux: clone(CANAUX_DEFAUT),
    matieres: matieresDefaut(),
    creations: [],
    pieces: [],
    commandes: [],
    photosModeles: {},
    chrono: {pid:null, poste:"crochet", debut:null}
  };
  return s;
